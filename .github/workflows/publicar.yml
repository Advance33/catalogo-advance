# Publicar el catálogo en GitHub Pages con la portada sin comentarios
# (auditoría 04/11/2026, TG-04; Benja dijo que sí el 05/11).
#
# index.html pesa ~1 MB y el 42 % son comentarios: la documentación del
# código, que se queda en el repo. Lo que se publica es una copia del repo
# con index.html sin comentarios (.github/publicar/minificar.js, con terser),
# y todo lo demás igual, byte a byte: producto/, p/, fotos/, datos/, marian/,
# sitemap.xml, robots.txt, 404.html, CNAME… Los archivos ocultos (.gitignore,
# .nojekyll…) no se publican: no hacen falta para el sitio.
#
# Salvo una cosa (Benja, 12/11/2026, buscadores con IA: «Sí, con fecha»): antes
# de copiar, producto/, preguntas/, llms.txt y sitemap.xml se vuelven a armar
# con el precio y el stock de ADVAPP de ese momento escritos, con la hora
# (herramientas/paginas-producto.py --con-precio). Las IA que buscan en
# internet leen el HTML sin correr el script y sin esto no veían ningún
# precio. No se commitea nada: en main esas páginas siguen sin precio.
# No gasta tokens ni relee listas (Benja, 12/11: «con lo que hay actualizado
# en la web»): baja de ADVAPP lo mismo que baja la portada al abrirla
# (resource=tecno-web, lo ya guardado), sin pasar por el lector de listas.
#
# Antes de publicar, .github/publicar/verificar.py abre en Chrome la portada
# del repo y la sin comentarios, con los datos de ADVAPP del momento y la
# medición apagada, y compara. Si a la copia le falta un archivo, o la
# portada sin comentarios tira un error de JavaScript que la otra no tira, o
# no dibuja lo mismo, el workflow falla y NO publica: queda lo que estaba.
#
# Cuándo corre:
#   - push a main (un merge o PUBLICAR): arma, verifica y publica.
#   - un PR a main que toque index.html o .github/: arma y verifica, sin
#     publicar. Así un cambio que rompa la copia se ve antes del merge.
#     También si toca robots.txt, el que arma las páginas o la herramienta de
#     IndexNow: ahí corren las pruebas de esa herramienta, y si fallan el PR
#     queda en rojo (en main solo dejan una advertencia). En esos PR, al
#     final, se abre en Chrome la página de un modelo de mentira para ver qué
#     anota en la medición (herramientas/probar-pagina-modelo.py, 13/11/2026);
#     por eso también corre si el PR toca esa prueba o lo que usa para abrir
#     Chrome. En una publicación eso no corre.
#   - a mano (Actions › Publicar el catálogo › Run workflow): como un push,
#     salvo lo del precio que se explica abajo. Con "esperar_fuente" tildado,
#     si Pages todavía publica desde la rama, espera hasta 15 minutos a que
#     cambie y publica apenas cambia (es para el primer cambio de Settings ›
#     Pages › Source, sin que la web quede sin publicar ni un minuto).
#   - todos los días a las 15:07 y a las 18:07 de Argentina (Benja,
#     12/11/2026: «solo a las 15h y 18h»), para rearmar el precio escrito en
#     las páginas. De las 18 a las 15 del otro día queda el de las 18, con su
#     fecha. En cada push también se rearma: si no, publicar cualquier cambio
#     dejaba las páginas sin precio hasta las 15.
#     No va a la hora en punto: GitHub demora las programadas, sobre todo las
#     del minuto 0, y a veces las saltea (el 12/11 la de las 15:00 no había
#     arrancado una hora después). No hay un corte a las 15 ni a las 18: toma
#     lo que hay en ADVAPP cuando arranca, y esa hora queda escrita en la
#     página. Además GitHub apaga lo programado si el repo pasa 60 días sin
#     cambios (se vuelve a prender en Actions).
#
# Si no se puede escribir el precio (ADVAPP o Chrome no contestan, tampoco al
# segundo intento, un minuto después):
#   - en un push hay un cambio que publicar: se publican las páginas del
#     repo, sin precio, con un aviso;
#   - en la corrida programada y en la que se larga a mano no hay nada más
#     que publicar. Si lo publicado tiene precio de hoy, la corrida falla y no
#     publica: queda ese precio, con su hora, en vez de pisarlo con páginas
#     sin precio. Si lo publicado es de otro día (o no se pudo mirar), se
#     publica sin precio, como en un push: un precio de ayer no se deja.
#
# Después de publicar le avisa a Bing qué páginas cambiaron (IndexNow,
# 12/11/2026, herramientas/indexnow.py): sin el aviso, Bing tarda días en
# volver a pasar y Copilot sigue contando el precio viejo. Antes de publicar
# compara cada página recién armada con la publicada, sin la hora del precio;
# si ninguna dice otra cosa, no avisa nada. Solo lee y nunca frena la
# publicación: si la comparación o el aviso fallan, queda una advertencia.
#
# Mientras Settings › Pages › Source diga "Deploy from a branch", este
# workflow arma y verifica pero NO publica: lo sigue publicando GitHub desde
# la rama, como siempre. Publica recién cuando Source diga "GitHub Actions".
name: Publicar el catálogo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['index.html', '.github/**', 'robots.txt', 'herramientas/paginas-producto.py', 'herramientas/indexnow.py',
            'herramientas/probar-pagina-modelo.py', 'herramientas/vista-previa.py', 'pruebas/correr.py']
  workflow_dispatch:
    inputs:
      esperar_fuente:
        description: 'Esperar (hasta 15 min) a que Settings › Pages › Source diga "GitHub Actions" y publicar apenas cambie'
        type: boolean
        default: false
  # 18:07 y 21:07 UTC = 15:07 y 18:07 de Argentina (arriba dice por qué no en punto)
  schedule:
    - cron: '7 18,21 * * *'

permissions:
  contents: read

jobs:
  armar:
    name: Armar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: armar-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      cambios: ${{ steps.cambios.outputs.cambios }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar terser (versión fija)
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/minificador" terser@5.31.6

      # El precio del momento (12/11/2026, ver arriba). Se arma en esta copia
      # del repo, antes de copiarla, con la portada CON comentarios (la que
      # conoce el generador). Si no se puede, prueba otra vez al minuto; qué
      # pasa si tampoco, según la corrida, está arriba ("Si no se puede
      # escribir el precio"). SOLO_PRECIO: la programada y la que se larga a
      # mano, que no traen ningún cambio para publicar.
      - name: Escribir el precio del momento en las páginas de cada modelo
        id: precio
        env:
          SOLO_PRECIO: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          armar() { python3 herramientas/paginas-producto.py --con-precio; }
          if armar; then exit 0; fi
          echo "::notice::No se pudo escribir el precio del momento. Se prueba otra vez en un minuto."
          git reset -q --hard HEAD
          git clean -fdq
          sleep 60
          if armar; then exit 0; fi
          git reset -q --hard HEAD
          git clean -fdq
          if [ "$SOLO_PRECIO" = true ]; then
            hoy=$(TZ=America/Argentina/Buenos_Aires date +%d/%m/%Y)
            publicado=$(curl -fsS --max-time 20 "https://$(cat CNAME)/llms.txt" | grep -o -E 'son del [0-9]{2}/[0-9]{2}/[0-9]{4}' | head -1 | cut -d' ' -f3 || true)
            if [ -n "$publicado" ] && [ "$publicado" = "$hoy" ]; then
              echo "::error::No se pudo escribir el precio del momento. Esta corrida solo existe para eso y lo publicado tiene precio de hoy ($publicado): no se publica y queda como está."
              exit 1
            fi
          fi
          echo "::warning::No se pudo escribir el precio del momento: se publican las páginas del repo, sin precio."
          echo "sin_precio=true" >> "$GITHUB_OUTPUT"

      # IndexNow (12/11/2026, ver arriba): qué páginas recién armadas dicen
      # otra cosa que las publicadas. La lista queda para el job "avisar".
      # Solo lee; si falla, se publica igual y no se avisa nada.
      # - Primero corre las pruebas de la herramienta: si alguien cambió cómo
      #   se escribe la hora del precio, fallan y no se avisa (sin esto se
      #   avisarían todas las páginas en cada corrida). En un PR, si fallan,
      #   el PR queda en rojo; en main dejan una advertencia y se publica.
      # - Compara solo cuando se va a publicar: en un PR no hay a quién avisar.
      # - Si no se pudo escribir el precio, no compara: saldrían todas como
      #   cambiadas, y otra vez todas cuando vuelva el precio.
      # - Tiene 4 minutos (la herramienta se da 2): si el sitio publicado no
      #   contesta, no llega a gastar los 15 del job.
      - name: Ver qué páginas cambiaron respecto de lo publicado
        id: cambios
        if: steps.precio.outputs.sin_precio != 'true'
        timeout-minutes: 4
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          COMPARAR: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if ! python3 herramientas/indexnow.py --probar; then
            echo "::warning::IndexNow: fallaron las pruebas de herramientas/indexnow.py. No se compara ni se avisa hasta arreglarlas."
            exit 1
          fi
          if [ "$COMPARAR" = true ]; then
            python3 herramientas/indexnow.py cambios
          fi

      - name: Copiar el sitio y sacar los comentarios de index.html
        env:
          TERSER: ${{ runner.temp }}/minificador/node_modules/terser
        run: |
          rsync -a --exclude='.*' ./ "$RUNNER_TEMP/sitio/"
          node .github/publicar/minificar.js index.html "$RUNNER_TEMP/sitio/index.html"

      - name: Verificar que la copia anda igual que la del repo
        run: python3 .github/publicar/verificar.py . "$RUNNER_TEMP/sitio"

      - name: Guardar la copia para publicarla
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/sitio
          retention-days: 1

      # Lo que anotan las páginas de cada modelo (13/11/2026): la pauta con la
      # que se llegó y cada toque a WhatsApp. Abre en Chrome una página armada
      # con un modelo de mentira, sin salir a la red. Solo en los PR, que es
      # donde cambia el script, y al final: lo de arriba ya se verificó. En
      # una publicación no corre y nunca la frena.
      - name: Probar lo que anotan las páginas de cada modelo
        if: github.event_name == 'pull_request'
        timeout-minutes: 8
        run: python3 herramientas/probar-pagina-modelo.py

  fuente:
    name: ¿Pages publica con GitHub Actions?
    needs: armar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: read
    outputs:
      publicar: ${{ steps.ver.outputs.publicar }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          ESPERAR: ${{ github.event_name == 'workflow_dispatch' && inputs.esperar_fuente }}
          ES_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          fuente() { gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo "no se pudo leer"; }
          t=$(fuente)
          echo "Settings › Pages › Source: $t (legacy = desde la rama; workflow = GitHub Actions)"
          if [ "$ES_MAIN" = true ] && [ "$t" != workflow ] && [ "$ESPERAR" = true ]; then
            echo "::notice::Esperando hasta 15 minutos a que Settings › Pages › Source pase a GitHub Actions..."
            for i in $(seq 1 180); do
              sleep 5
              t=$(fuente)
              [ "$t" = workflow ] && break
            done
          fi
          if [ "$ES_MAIN" = true ] && [ "$t" = workflow ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            if [ "$ES_MAIN" = true ]; then
              echo "::notice::Pages todavía publica desde la rama main (fuente: $t). Esta copia no se publica; el sitio sigue publicándose como siempre."
            fi
          fi

  publicar:
    name: Publicar
    needs: [armar, fuente]
    if: needs.fuente.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    # Una publicación a la vez y sin cortar la que está en curso (como el
    # ejemplo de GitHub); si llegan varias, se publica la última.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # IndexNow (12/11/2026, ver arriba). Corre solo si se publicó y si alguna
  # página cambió. Si falla no rompe nada: el sitio ya está publicado y Bing
  # lo ve cuando vuelve a pasar.
  avisar:
    name: Avisarle a Bing qué cambió (IndexNow)
    needs: [armar, publicar]
    if: needs.publicar.result == 'success' && needs.armar.outputs.cambios != '' && needs.armar.outputs.cambios != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      # Solo lo que usa: la herramienta y la portada (de donde sale la
      # dirección del sitio). El repo entero pesa por las fotos.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            herramientas/indexnow.py
            index.html
          sparse-checkout-cone-mode: false

      - name: Mandar la lista a IndexNow
        env:
          CAMBIOS: ${{ needs.armar.outputs.cambios }}
        run: python3 herramientas/indexnow.py avisar
