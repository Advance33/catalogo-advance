<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Advance — Stock y precios en vivo</title>
<meta name="description" content="Catálogo con stock y precios actualizados en tiempo real. Consultá por WhatsApp desde cualquier producto.">
<link rel="icon" href="assets/logo-mark.png">
<meta name="theme-color" content="#0A0710">

<!-- Mientras el catálogo sea de uso interno: le pide a Google y demás buscadores
     que NO lo indexen. El link sigue andando para cualquiera que lo tenga, pero
     no aparece en las búsquedas. Cuando salga al público, borrá esta línea
     (y también el robots.txt que está al lado del index). -->
<meta name="robots" content="noindex, nofollow">

<!-- Cómo se ve el link cuando lo mandás por WhatsApp, Instagram o Facebook.
     ⚠️ Esto solo funciona con el catálogo publicado en una dirección de internet:
     WhatsApp no puede entrar a un localhost. Al publicarlo, cambiá las dos
     líneas marcadas abajo por la dirección real y queda andando. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Advance Tecno">
<meta property="og:locale" content="es_AR">
<meta property="og:title" content="Catálogo Advance Tecno — Stock y precios en vivo">
<meta property="og:description" content="Todo lo que tenemos disponible, actualizado al momento. Consultá por WhatsApp desde cualquier producto.">
<meta property="og:image" content="https://advance33.github.io/catalogo-advance/assets/preview.png">          <!-- ← direccion publica del catalogo en GitHub Pages -->
<meta property="og:url" content="https://advance33.github.io/catalogo-advance/">                            <!-- ← direccion publica del catalogo en GitHub Pages -->
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Catálogo Advance Tecno: stock y precios en tiempo real">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Catálogo Advance Tecno — Stock y precios en vivo">
<meta name="twitter:description" content="Todo lo que tenemos disponible, actualizado al momento.">
<meta name="twitter:image" content="https://advance33.github.io/catalogo-advance/assets/preview.png">         <!-- ← direccion publica del catalogo en GitHub Pages -->

<style>
  /* ==========================================================================
     Sistema de diseño tomado de advancegrouparg.com
     Los colores y tipografías son los mismos que usa tu sitio.
     ========================================================================== */
  /* Lilita One: la redonda pesada tipo Brawl Stars. Dos archivos porque
     Google la parte por subconjuntos; el "latin" trae tildes y ñ. */
  @font-face{
    font-family:"Lilita One";
    src:url(assets/lilita-latin.woff2) format("woff2");
    font-weight:400; font-style:normal; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:"Lilita One";
    src:url(assets/lilita-latin-ext.woff2) format("woff2");
    font-weight:400; font-style:normal; font-display:swap;
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  @font-face{
    font-family:"Halagar";
    src:url(assets/halagar.woff2);   /* el archivo es OpenType pese al nombre;
                                        sin format() el navegador lo detecta solo */
    font-weight:100 900; font-style:normal; font-display:swap;
  }

  :root{
    --display:"Lilita One","Halagar","Futura","Avenir Next",system-ui,sans-serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;

    /* Paleta Ultravioleta. El diseño está comprometido con el modo oscuro:
       no cambia con el tema del celular del cliente, se ve siempre igual. */
    --paper:#0A0710;      /* fondo, negro casi puro con tinte violeta */
    --surface:#17102A;    /* tarjetas */
    --surface-2:#211738;  /* controles */
    --line:#2E1F52;       /* bordes */
    --ink:#F3EEFF;        /* texto principal */
    --muted:#B3A6D0;      /* texto secundario */
    --faint:#7D6FA0;      /* texto tenue */
    --acento:#A855F7;     /* el morado: botones, chip activo */
    --glow:#C084FC;       /* resplandor y hover */
    --ok:#5EE9A4;
    --ok-soft:rgba(94,233,164,.12);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 44px rgba(10,7,16,.7);
    --foto-bg:#F5F5F7;    /* gris muy claro: los productos blancos (Pencil, AirTag, AirPods) desaparecen sobre fondo blanco */
    --radius:14px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:0 20px}

  /* Etiqueta chiquita en monoespaciada con el punto, como en tu sitio */
  .eyebrow{
    font:600 10.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:8px;
  }
  .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

  /* ---------- Encabezado ---------- */
  header{
    color:#fff;position:relative;overflow:hidden;
    background:
      radial-gradient(120% 90% at 15% -20%, rgba(168,85,247,.30), transparent 60%),
      radial-gradient(90% 80% at 95% 0%, rgba(192,132,252,.16), transparent 55%),
      #0A0710;
    border-bottom:1px solid var(--line);
  }
  .head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 0 6px}
  .logo{display:flex;align-items:center;gap:10px}
  /* El PNG es línea oscura sobre transparente: hay que invertirlo para que se
     vea blanco sobre el fondo negro, igual que en advancegrouparg.com */
  .marca-btn{
    background:transparent;border:0;padding:0;cursor:pointer;line-height:0;
    border-radius:8px;transition:filter .2s, transform .12s;
  }
  .marca-btn img{height:24px;width:auto;display:block;filter:invert(1);opacity:.95}
  .marca-btn:hover img{filter:invert(1) drop-shadow(0 0 7px var(--glow))}
  .marca-btn:active{transform:scale(.92)}
  .logo a{text-decoration:none;color:#fff}
  .logo b{font:400 17px/1 var(--display);text-transform:uppercase;letter-spacing:.06em}
  .logo b span{color:var(--glow)}
  .head .eyebrow{color:rgba(255,255,255,.55)}
  .stamp{margin-left:auto;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
         color:rgba(255,255,255,.6);display:flex;align-items:center;gap:8px;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:#5ED79B;flex:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .dot.live{animation:pulse 2.4s ease-in-out infinite}

  .titulo-h{
    font:400 clamp(1.9rem,4.6vw,3.1rem)/0.98 var(--display);
    text-transform:uppercase;letter-spacing:-.005em;margin:14px 0 6px;
  }

  /* Entrada del encabezado, escalonada de arriba hacia abajo */
  @media (prefers-reduced-motion: no-preference){
    @keyframes subir{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    .head, .titulo-h, .bajada, .search{animation:subir .6s cubic-bezier(.22,.7,.3,1) both}
    .titulo-h{animation-delay:.06s}
    .bajada  {animation-delay:.13s}
    .search  {animation-delay:.19s}
    /* El resplandor del fondo respira despacio */
    @keyframes respirar{0%,100%{opacity:1}50%{opacity:.72}}
    header::before{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(120% 90% at 15% -20%, rgba(168,85,247,.22), transparent 60%);
      animation:respirar 9s ease-in-out infinite;
    }
    header > *{position:relative;z-index:1}
    /* La barra de filtros se despega cuando arrancás a bajar */
    .toolbar{transition:box-shadow .25s, background .25s}
    .toolbar.pegada{box-shadow:0 6px 26px rgba(0,0,0,.45)}
  }
  .bajada{color:rgba(255,255,255,.62);font-size:14.5px;margin:0 0 20px;max-width:52ch}

  .search{position:relative;display:flex;align-items:center;max-width:660px;padding-bottom:22px}
  .search svg{position:absolute;left:16px;width:18px;height:18px;color:var(--faint);pointer-events:none}
  #q{
    width:100%;padding:14px 15px 14px 45px;font:16px var(--sans);
    background:rgba(255,255,255,.06);color:#fff;
    border:1px solid rgba(192,132,252,.28);border-radius:999px;outline:none;
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  #q::placeholder{color:#8E7FB4}
  #q:focus{border-color:var(--glow);background:rgba(255,255,255,.09);
           box-shadow:0 0 0 4px rgba(168,85,247,.18), 0 0 26px rgba(168,85,247,.22)}
  .clear{position:absolute;right:6px;border:0;background:transparent;cursor:pointer;
         color:#8E7FB4;font-size:20px;line-height:1;padding:7px 13px;border-radius:999px}
  .clear:hover{background:rgba(255,255,255,.09);color:#fff}

  /* ---------- Filtros ---------- */
  .toolbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
  /* La cinta de categorías se desliza: con el dedo, con la rueda del mouse,
     arrastrándola, o con las flechas de los costados. */
  .chips-wrap{position:relative}
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none;
    cursor:grab;overscroll-behavior-x:contain;
    /* Sin esto, el arrastre a mano pelearía contra la animación del navegador */
    scroll-behavior:auto;
  }
  .chips::-webkit-scrollbar{display:none}
  .chips.arrastrando{cursor:grabbing;user-select:none;scroll-snap-type:none}
  .chips.arrastrando .chip{pointer-events:none}

  /* Degradés en las puntas: avisan que hay más para el costado */
  .chips-wrap::before,.chips-wrap::after{
    content:"";position:absolute;top:0;bottom:0;width:54px;z-index:2;
    pointer-events:none;opacity:0;transition:opacity .2s;
  }
  .chips-wrap::before{left:0;background:linear-gradient(90deg,var(--surface) 30%,transparent)}
  .chips-wrap::after{right:0;background:linear-gradient(270deg,var(--surface) 30%,transparent)}
  .chips-wrap.hay-izq::before,.chips-wrap.hay-der::after{opacity:1}

  .chip-nav{
    position:absolute;top:50%;transform:translateY(-50%) scale(.85);z-index:3;
    width:30px;height:30px;padding:0;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;
    background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s, color .16s, border-color .16s;
  }
  .chip-nav svg{width:15px;height:15px;display:block}
  .chip-nav.izq{left:-6px}
  .chip-nav.der{right:-6px}
  .chip-nav:hover{color:var(--ink);border-color:var(--glow)}
  .chip-nav:active{transform:translateY(-50%) scale(.95)}
  .chips-wrap.hay-izq .chip-nav.izq,
  .chips-wrap.hay-der .chip-nav.der{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
  /* En pantallas táctiles las flechas sobran: se desliza con el dedo */
  @media (hover:none){ .chip-nav{display:none} .chips{cursor:auto} }
  .chip{
    flex:none;padding:8px 15px;border-radius:999px;cursor:pointer;
    font:600 10.5px/1.6 var(--mono);letter-spacing:.12em;text-transform:uppercase;
    background:transparent;color:var(--muted);border:1px solid var(--line);white-space:nowrap;
  }
  .chip:hover{color:var(--ink);border-color:var(--glow)}
  .chip[aria-pressed="true"]{
    background:var(--acento);color:#fff;border-color:var(--acento);
    box-shadow:0 0 18px rgba(168,85,247,.45);
  }

  /* ---------- Segunda cinta: las marcas de la sección ----------
     Antes esto era un select con las 21 marcas del catálogo entero, así que
     en Consolas te ofrecía Canon o Nikon, que no tienen ni una. Ahora muestra
     solo las que hay adentro de lo que estás mirando, con cuántas son.
     Van más chicos y sin relleno morado al elegirlos: el chip de categoría
     tiene que seguir siendo el que manda en la barra. */
  .chips-marcas{border-top:1px solid var(--line)}
  .chips-marcas[hidden]{display:none}
  .chips-marcas .chips{padding:8px 0 9px}
  .chip-marca{
    display:flex;align-items:center;gap:7px;
    padding:6px 12px;font-size:9.5px;text-transform:none;letter-spacing:.08em;
  }
  .chip-marca i{
    font-style:normal;font-size:9px;letter-spacing:.04em;
    padding:2px 5px;border-radius:5px;background:var(--surface-2);color:var(--faint);
  }
  .chip-marca[aria-pressed="true"]{
    background:rgba(168,85,247,.16);color:var(--glow);border-color:var(--acento);
    box-shadow:none;
  }
  .chip-marca[aria-pressed="true"] i{background:rgba(168,85,247,.28);color:#fff}

  .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 0 12px}
  select{
    padding:9px 13px;font:13px var(--sans);border-radius:999px;cursor:pointer;
    background:var(--surface);color:var(--ink);border:1px solid var(--line);
  }
  select[hidden]{display:none}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .toggle input{width:16px;height:16px;accent-color:var(--acento);cursor:pointer}
  .count{margin-left:auto;font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

  /* En la compu los filtros entran en un renglón y quedan a la vista. En el
     celular ocupaban tres, y como la barra es sticky se comían un quinto de la
     pantalla todo el tiempo. Ahí se esconden detrás de este botón: la cinta de
     categorías, que es lo que más se toca, sigue siempre arriba. */
  .filtros-btn{display:none}
  @media (max-width:560px){
    .filtros-btn{
      display:flex;align-items:center;gap:7px;order:-1;
      padding:9px 14px;border-radius:999px;cursor:pointer;
      background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
      font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
    }
    .filtros-btn svg{width:13px;height:13px;display:block;transition:transform .2s}
    .filtros-btn[aria-expanded="true"]{border-color:var(--glow)}
    .filtros-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
    .row2 select,.row2 .toggle{display:none}
    .row2.abierta select{display:block}
    .row2.abierta .toggle{display:flex}
    /* Montura y apertura siguen siendo cosa de lentes, abierta o no */
    .row2.abierta select[hidden]{display:none}
  }

  /* ---------- Grilla ---------- */
  .grid{display:grid;gap:14px;padding:22px 0 64px;grid-template-columns:repeat(auto-fill,minmax(216px,1fr))}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);
    transition:transform .16s, box-shadow .16s;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 2px 6px rgba(0,0,0,.3),0 18px 48px rgba(168,85,247,.16);border-color:rgba(168,85,247,.35)}

  /* Aparición al entrar en pantalla. Solo se anima lo que estás mirando:
     con 483 tarjetas, animarlas todas de una vez trabaría el scroll. */
  @media (prefers-reduced-motion: no-preference){
    .card{opacity:0;transform:translateY(14px) scale(.98)}
    .card.vis{opacity:1;transform:none}
    .card{transition:opacity .42s cubic-bezier(.22,.7,.3,1),
                     transform .42s cubic-bezier(.22,.7,.3,1),
                     box-shadow .18s, border-color .18s}
    .card.vis:hover{transform:translateY(-3px)}
    /* La foto entra con un fundido cuando termina de bajar */
    .foto img{opacity:0;transition:opacity .45s ease}
    .foto img.ok{opacity:1}
  }

  .foto{position:relative;aspect-ratio:1/1;background:var(--foto-bg);
        display:flex;align-items:center;justify-content:center;overflow:hidden}
  .foto img{width:100%;height:100%;object-fit:contain;padding:14px;display:block}
  .sinfoto{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    /* Oscuro a propósito: el fondo claro de .foto es para las fotos reales
       (los productos blancos se pierden sobre blanco). Donde no hay foto no
       hay nada que proteger, y un bloque blanco gigante le roba la atención
       al producto. */
    width:100%;height:100%;background:repeating-linear-gradient(45deg,#1B1330 0 10px,#161029 10px 20px);
  }
  .sinfoto b{font:400 15px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em;
             color:#6E6091;text-align:center;padding:0 10px}
  .sinfoto i{font:500 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#4C4270;font-style:normal}

  .badge{font:600 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
         padding:5px 9px;border-radius:999px;white-space:nowrap;flex:none}
  /* Sobre la foto va flotando; en modo compacto va al lado de la marca */
  .foto .badge{position:absolute;top:10px;left:10px;z-index:2}
  .badge.si{background:var(--ok-soft);color:var(--ok)}
  .badge.no{background:var(--surface-2);color:var(--faint)}

  .cuerpo{padding:13px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
  .marca{
    font:600 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .nombre{
    font:400 15px/1.28 var(--display);text-transform:uppercase;letter-spacing:.005em;margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.56em;
    /* "(BLACK/WHITE/PINK/ULTRAMARINE/TEAL)" es un solo token: sin esto se
       desborda de la tarjeta y el line-clamp corta a mitad de palabra. */
    overflow-wrap:anywhere;
  }
  .meta{font:11.5px/1.4 var(--sans);color:var(--faint);margin:0;
        display:flex;align-items:center;gap:7px;flex-wrap:wrap;overflow-wrap:anywhere}
  /* Los colores en los que viene el producto. La foto muestra uno solo,
     así que estos puntitos son lo único que cuenta la historia completa. */
  .pintas{display:inline-flex;gap:4px;flex:none}
  .pintas i{
    width:12px;height:12px;border-radius:50%;display:block;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), 0 1px 2px rgba(0,0,0,.5);
  }
  .fi-tabla .pintas i{width:14px;height:14px}
  .fi-tabla dd .pintas{vertical-align:-3px;margin-right:7px}
  .incluye{font:600 11px/1.35 var(--sans);color:var(--ok);background:var(--ok-soft);padding:6px 9px;border-radius:8px}
  /* Las capacidades en las que viene el modelo. Una línea sola: si no entra se
     corta, porque el detalle completo está en la ficha. */
  .opciones{font:500 10.5px/1.4 var(--mono);color:var(--glow);margin:0;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .pie{margin-top:auto;padding-top:11px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .usd{font:400 23px/1 var(--display);letter-spacing:.01em}
  /* El "desde" no compite con el número: es una aclaración, no el precio */
  .usd .desde{font:600 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
              color:var(--faint);font-style:normal;display:block;margin-bottom:5px}
  .ars{font:500 12px/1 var(--mono);letter-spacing:.03em;color:var(--muted);margin-top:5px}
  /* WhatsApp en la tarjeta queda como ícono: el logo se reconoce sin leer, y
     el texto lo necesita más el otro botón, que es el que arma el pedido.
     Ninguno de los dos va lleno de morado. Con quince tarjetas en pantalla,
     quince botones llenos dejaban de resaltar: el morado sólido quedó para una
     sola cosa por pantalla, que es enviar el pedido. */
  .wa{
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;flex:none;width:44px;border-radius:999px;
    color:var(--glow);background:transparent;
    border:1px solid rgba(168,85,247,.42);
    transition:background .16s, border-color .16s, color .16s, transform .12s;
  }
  .wa svg{width:19px;height:19px;flex:none;display:block}
  .wa:hover{background:rgba(168,85,247,.16);border-color:var(--glow);color:#fff}
  .wa:active{transform:scale(.94)}
  /* La tarjeta entera empuja hacia las acciones al pasar el mouse */
  .card:hover .wa{border-color:rgba(168,85,247,.7)}

  /* En la ficha el CTA va primero, ocupa todo el ancho y es el doble de alto
     que "Agregar al pedido". No compiten: uno manda y el otro acompaña. */
  .fi-botones{flex-direction:column;gap:9px}
  .fi-botones .cta{
    display:flex;align-items:center;justify-content:center;gap:9px;
    text-decoration:none;padding:15px 16px;font-size:11.5px;letter-spacing:.1em;
    box-shadow:0 0 0 1px rgba(192,132,252,.45), 0 8px 26px rgba(168,85,247,.45);
  }
  .fi-botones .cta svg{width:17px;height:17px;flex:none;display:block}
  .fi-botones .cta:hover{filter:brightness(1.08);box-shadow:0 0 0 1px var(--glow), 0 12px 36px rgba(168,85,247,.7)}
  .fi-botones .sec{padding:11px 14px;font-size:10px;opacity:.85}
  .fi-botones .sec:hover{opacity:1}
  /* El contador de unidades y el "quitar" son una sola pieza dentro de la columna */
  #fi-pedido-caja{display:flex;flex-direction:column;gap:9px}
  .card.agotado .foto img{filter:grayscale(1);opacity:.5}
  .card.agotado .usd,.card.agotado .ars{color:var(--faint)}

  /* Modo compacto: mientras no haya NINGUNA foto cargada en el catálogo.
     Evita dibujar cientos de recuadros vacíos. Vuelve solo al cargar la primera. */
  .card.compacta .cuerpo{padding:15px 16px 16px}
  .card.compacta .nombre{min-height:0}

  /* ---------- Estados ---------- */
  .msg{padding:64px 20px;text-align:center;color:var(--muted)}
  .msg h2{color:var(--ink);font:400 20px/1.2 var(--display);text-transform:uppercase;margin:0 0 12px}
  .msg code{background:var(--surface-2);padding:3px 8px;border-radius:6px;font:12px var(--mono);word-break:break-all}
  .msg ol{text-align:left;max-width:520px;margin:16px auto 0;line-height:1.95}
  .skeleton{height:300px;border-radius:var(--radius);
    background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);
    background-size:200% 100%;animation:sk 1.4s linear infinite}
  @keyframes sk{to{background-position:-200% 0}}

  /* ---------- Botón flotante de WhatsApp ----------
     Blanco a propósito: sobre el fondo violeta oscuro es lo único claro de la
     pantalla, así que se encuentra sin buscarlo. */
  .wa-flotante{
    position:fixed;right:20px;bottom:20px;z-index:500;
    display:flex;align-items:center;gap:9px;
    padding:12px 20px 12px 16px;border-radius:999px;
    background:#fff;color:#0A0710;text-decoration:none;
    box-shadow:0 6px 22px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.12);
    transition:transform .16s cubic-bezier(.22,.7,.3,1), box-shadow .2s;
  }
  /* El display:flex de arriba le gana al hidden del navegador: hay que repetirlo */
  .wa-flotante[hidden]{display:none}
  .wa-flotante svg{width:22px;height:22px;display:block;flex:none}
  .wa-flotante b{font:600 13px/1 var(--sans);letter-spacing:.01em}
  .wa-flotante:hover{transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(0,0,0,.6), 0 0 0 1px rgba(192,132,252,.6), 0 0 26px rgba(168,85,247,.35)}
  .wa-flotante:active{transform:translateY(0) scale(.97)}
  @media (prefers-reduced-motion: no-preference){
    @keyframes waEntra{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
    .wa-flotante{animation:waEntra .5s .8s cubic-bezier(.22,.7,.3,1) both}
  }
  /* En el celular queda solo el ícono: el texto se comería media pantalla */
  @media (max-width:560px){
    .wa-flotante{right:14px;bottom:14px;padding:13px;gap:0}
    .wa-flotante b{display:none}
  }

  /* El 96 de abajo es el lugar que ocupa el botón flotante */
  footer{border-top:1px solid var(--line);padding:26px 0 96px;color:var(--faint);
         font:11px/1.7 var(--mono);letter-spacing:.06em;text-transform:uppercase;text-align:center}

  /* ---------- Panel de cotización ---------- */
  #cfg-btn{
    background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:999px;
    color:rgba(255,255,255,.75);cursor:pointer;padding:5px;line-height:0;margin-left:2px;
    transition:border-color .16s, color .16s, transform .3s;
  }
  #cfg-btn svg{width:15px;height:15px;display:block}
  #cfg-btn:hover{border-color:var(--glow);color:#fff;transform:rotate(60deg)}

  /* Todas las ventanas (cotización, ficha de producto, pedido) comparten esto */
  .modal{
    position:fixed;inset:0;z-index:900;display:grid;place-items:center;padding:20px;
    background:rgba(10,7,16,.72);backdrop-filter:blur(4px);
  }
  @media (prefers-reduced-motion: no-preference){
    @keyframes modalIn{from{opacity:0}to{opacity:1}}
    @keyframes cajaIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
    .modal{animation:modalIn .2s ease-out}
    .modal .caja{animation:cajaIn .3s cubic-bezier(.22,.7,.3,1) both}
  }
  /* Con una ventana abierta, el fondo no se mueve */
  body.modal-abierto{overflow:hidden}
  .caja:focus{outline:none}
  .caja{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:22px;width:min(400px,100%);box-shadow:0 24px 70px rgba(0,0,0,.6);
  }
  .modal h3{font:400 20px/1 var(--display);text-transform:uppercase;margin:0 0 18px;letter-spacing:.02em}
  #panel .op{display:flex;gap:11px;align-items:flex-start;cursor:pointer;padding:9px 0}
  #panel .op input{margin-top:3px;accent-color:var(--acento);width:16px;height:16px;flex:none}
  #panel .op b{display:block;font:600 13px/1.3 var(--sans)}
  #panel .op i{display:block;font-style:normal;font-size:11.5px;color:var(--faint);margin-top:2px}
  #panel select,#panel input[type=number]{
    background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;font:14px var(--sans);width:100%;
  }
  #panel select{margin:0 0 4px 27px;width:calc(100% - 27px)}
  #panel select:disabled,#panel input:disabled{opacity:.4}
  #panel .campo{display:flex;align-items:center;gap:8px;margin:0 0 6px 27px}
  #panel .campo span{font:600 12px/1 var(--mono);color:var(--faint);flex:none}
  #panel .campo.recargo{margin:14px 0 4px 0;padding-top:14px;border-top:1px solid var(--line)}
  #panel .aviso{font-size:11.5px;line-height:1.5;color:var(--faint);margin:16px 0 0}
  #panel .aviso b{color:var(--muted)}
  .modal .botones{display:flex;gap:9px;margin-top:18px}
  .modal .botones button,.modal .botones a{
    flex:1;padding:12px;border-radius:999px;cursor:pointer;text-align:center;text-decoration:none;
    font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  }
  .modal .pri{background:var(--acento);color:#fff;border:0}
  .modal .pri:hover{background:var(--glow)}
  .modal .sec{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .modal .sec:hover{color:var(--ink);border-color:var(--faint)}

  /* ---------- Ficha de producto ---------- */
  #ficha .caja{
    width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:0;
    display:flex;flex-direction:column;
  }
  .fi-cerrar{
    position:absolute;top:14px;right:14px;z-index:4;width:34px;height:34px;padding:0;
    border-radius:50%;cursor:pointer;display:grid;place-items:center;
    background:rgba(10,7,16,.6);color:#fff;border:1px solid rgba(255,255,255,.2);
    backdrop-filter:blur(6px);font-size:20px;line-height:1;
  }
  .fi-cerrar:hover{background:var(--acento);border-color:var(--acento)}
  #ficha .caja{position:relative}
  .fi-cols{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr)}
  /* Sin aspect-ratio fijo: es un item del grid, asi que se estira solo hasta
     la altura de la columna de datos. Con 1/1 quedaba clavado en 320px y
     dejaba un hueco muerto abajo, que es lo que pasa casi siempre porque los
     datos son mas altos. El min-height cubre el caso inverso: ficha corta. */
  .fi-foto{position:relative;background:var(--foto-bg);min-height:320px;
           display:flex;align-items:center;justify-content:center;overflow:hidden}
  .fi-foto img{width:100%;height:100%;object-fit:contain;padding:22px;display:block}
  .fi-foto .badge{position:absolute;top:12px;left:12px}
  .fi-datos{padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .fi-marca{font:600 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--glow)}
  .modal .fi-nombre{font:400 clamp(1.15rem,2.6vw,1.6rem)/1.15 var(--display);
                    text-transform:uppercase;margin:0;letter-spacing:.005em;padding-right:38px}
  .fi-marca{padding-right:38px}
  .fi-detalle{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0;white-space:pre-line}
  .fi-tabla{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0;
            font-size:12.5px;border-top:1px solid var(--line);padding-top:13px}
  .fi-tabla dt{font:600 9.5px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .fi-tabla dd{margin:0;color:var(--ink);word-break:break-word}
  .fi-precio{border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
  .fi-precio .usd{font:400 30px/1 var(--display)}
  .fi-precio .ars{font:500 13px/1 var(--mono);color:var(--muted);margin-top:6px}
  .fi-nota{font-size:11px;color:var(--faint);margin:0}

  /* ---------- Elegir color en la ficha ----------
     En la grilla los puntitos son decorativos. Acá el cliente está decidiendo,
     así que son botones: tocás uno y ese color queda elegido para el pedido y
     para el mensaje de WhatsApp. Si existe la foto de ese color, la foto cambia. */
  .fi-pintas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:5px}
  .fi-pintas button{
    width:20px;height:20px;padding:0;border-radius:50%;cursor:pointer;display:block;
    border:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), 0 1px 2px rgba(0,0,0,.5);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .fi-pintas button:hover{transform:scale(1.12)}
  /* El anillo va por fuera del puntito para no taparle el color */
  .fi-pintas button[aria-pressed="true"]{
    transform:scale(1.06);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.3), 0 0 0 2px var(--surface), 0 0 0 4px var(--glow);
  }
  /* Color que no está en la lista de hex: no inventamos el tono, se marca con rayas */
  .fi-pintas button.sinhex{
    background:repeating-linear-gradient(45deg,var(--line),var(--line) 3px,transparent 3px,transparent 6px);
    box-shadow:inset 0 0 0 1px var(--faint);
  }
  .fi-color-elegido{color:var(--ink)}
  .fi-color-elegido b{font-weight:600;color:var(--glow)}
  .fi-tabla dd .fi-hint{display:block;font-size:10.5px;color:var(--faint);margin-top:3px}
  /* El display:block de arriba le gana al hidden si no se dice esto */
  .fi-tabla dd .fi-hint[hidden]{display:none}

  /* ---------- Elegir versión (capacidad, medida, color) ----------
     Cada botón lleva su propio precio: el cliente compara sin tener que ir
     tocando uno por uno. */
  .fi-ops-caja{border-top:1px solid var(--line);padding-top:13px;display:flex;
               flex-direction:column;gap:8px}
  .fi-ops-lbl{font:600 9.5px/1.5 var(--mono);letter-spacing:.14em;
              text-transform:uppercase;color:var(--faint)}
  .fi-ops{display:flex;flex-wrap:wrap;gap:7px}
  .fi-op{
    display:flex;flex-direction:column;gap:3px;align-items:flex-start;
    padding:8px 12px;border-radius:11px;cursor:pointer;text-align:left;
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    transition:border-color .12s ease, background .12s ease;
  }
  .fi-op b{font:500 12px/1.2 var(--sans);letter-spacing:.01em}
  .fi-op i{font:500 10.5px/1 var(--mono);color:var(--muted);font-style:normal}
  .fi-op:hover{border-color:var(--faint)}
  .fi-op[aria-pressed="true"]{
    border-color:var(--acento);background:rgba(168,85,247,.16);
    box-shadow:0 0 0 1px var(--acento);
  }
  .fi-op[aria-pressed="true"] i{color:var(--glow)}
  /* Sin stock se puede elegir igual (el cliente quiere ver el precio), pero se
     nota de una que no está disponible */
  .fi-op.agotada{opacity:.5}
  .fi-op.agotada b{text-decoration:line-through}

  /* ---------- Cuántas unidades ---------- */
  .fi-cant{display:flex;align-items:center;gap:10px;justify-content:space-between;
           border:1px solid var(--line);border-radius:999px;padding:5px 6px}
  .fi-cant .lbl{font:600 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
                color:var(--faint);padding-left:10px}
  .stepper{display:flex;align-items:center;gap:2px}
  .stepper button{
    width:30px;height:30px;flex:none;border-radius:50%;cursor:pointer;
    background:transparent;border:1px solid var(--line);color:var(--ink);
    font:400 17px/1 var(--sans);display:grid;place-items:center;padding:0;
  }
  .stepper button:hover:not(:disabled){border-color:var(--glow);color:var(--glow)}
  .stepper button:disabled{opacity:.35;cursor:default}
  .stepper .n{min-width:30px;text-align:center;font:500 14px/1 var(--mono);color:var(--ink)}
  /* El x2 al lado del precio: sin esto el total del pedido no se explica solo */
  .fi-precio .sub{font:500 12px/1 var(--mono);color:var(--glow);margin-top:7px}

  @media (max-width:640px){
    .fi-cols{grid-template-columns:1fr}
    .fi-foto{aspect-ratio:4/3;min-height:0}
    .fi-datos{padding:18px}
  }

  /* ---------- Especificaciones deducidas ---------- */
  .specs{display:flex;flex-wrap:wrap;gap:5px}
  .specs span{
    font:600 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
    padding:5px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);
    border:1px solid var(--line);white-space:nowrap;
  }
  .fi-datos .specs span{font-size:10px;padding:6px 10px}

  /* ---------- Botones de la tarjeta ---------- */
  .acciones{display:flex;gap:8px}
  /* El que arma el pedido es el ancho y el único con texto: es la acción que
     deja vender varios productos en un solo mensaje, y como ícono suelto nadie
     entendía qué hacía. Los 44px son el mínimo para el dedo. */
  .mas{
    flex:1;min-width:0;min-height:44px;
    display:flex;align-items:center;justify-content:center;gap:7px;
    border-radius:999px;cursor:pointer;
    font:700 11.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
    background:rgba(168,85,247,.12);color:var(--ink);border:1px solid rgba(168,85,247,.42);
    transition:background .16s, color .16s, border-color .16s, transform .12s;
  }
  /* Los dos íconos van apilados en la misma celda y el CSS muestra el que va.
     Ojo con la especificidad: quien esconde tiene que pesar más que el svg. */
  .mas .ico{display:grid;place-items:center;width:16px;height:16px;flex:none}
  .mas .ico svg{width:16px;height:16px;display:block;grid-area:1/1}
  .mas .ico .i-ok,.mas .txt-ok{display:none}
  .mas[aria-pressed="true"] .ico .i-mas,.mas[aria-pressed="true"] .txt-add{display:none}
  .mas[aria-pressed="true"] .ico .i-ok{display:block}
  .mas[aria-pressed="true"] .txt-ok{display:inline}
  .mas:hover{background:rgba(168,85,247,.22);border-color:var(--glow)}
  .mas:active{transform:scale(.97)}
  .mas[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:rgba(94,233,164,.55)}
  .card{cursor:pointer}
  .card:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

  /* ---------- Barra del pedido ---------- */
  .barra-pedido{
    position:fixed;left:0;right:0;bottom:0;z-index:600;
    background:var(--surface);border-top:1px solid var(--line);
    box-shadow:0 -8px 30px rgba(0,0,0,.5);
    /* El contenido sigue la misma caja de 1280 que el resto de la página: sin
       esto, en pantallas anchas el total quedaba contra un borde y el CTA
       contra el otro, con medio metro de vacío en el medio. */
    padding:11px max(20px, calc((100% - 1280px) / 2 + 20px));
    display:flex;align-items:center;gap:14px;
  }
  .barra-pedido[hidden]{display:none}
  @media (prefers-reduced-motion: no-preference){
    @keyframes bpEntra{from{transform:translateY(100%)}to{transform:none}}
    .barra-pedido{animation:bpEntra .28s cubic-bezier(.22,.7,.3,1)}
  }
  /* Con fondo y chevron se lee como botón. Antes parecía una etiqueta y casi
     nadie descubría que ahí adentro estaba la lista del pedido. */
  .bp-ver{
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink);cursor:pointer;
    display:flex;align-items:center;gap:8px;
    border-radius:999px;padding:10px 15px;font:600 10.5px/1 var(--mono);
    letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  }
  .bp-ver::after{
    content:"";width:6px;height:6px;flex:none;opacity:.65;
    border:1.6px solid currentColor;border-left:0;border-bottom:0;
    transform:rotate(-45deg) translate(-1px,1px);
  }
  .bp-ver:hover{border-color:var(--glow)}
  .bp-total{display:flex;flex-direction:column;gap:3px;min-width:0}
  .bp-total b{font:400 19px/1 var(--display);letter-spacing:.01em}
  .bp-total i{font:500 11px/1 var(--mono);color:var(--faint);font-style:normal}
  .bp-enviar{
    margin-left:auto;flex:none;text-decoration:none;color:#fff;
    background:linear-gradient(135deg,var(--acento),#8B3FE0);
    border-radius:999px;padding:13px 22px;font:600 10.5px/1 var(--mono);
    letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
    box-shadow:0 0 0 1px rgba(192,132,252,.35), 0 6px 20px rgba(168,85,247,.3);
  }
  .bp-enviar:hover{box-shadow:0 0 0 1px var(--glow), 0 8px 30px rgba(168,85,247,.5)}
  /* Con el pedido abierto, el flotante se va. Ya hay un WhatsApp por tarjeta y
     otro en la ficha: un tercero encima de la barra no suma, y le compite el
     lugar al único botón que importa en ese momento, que es enviar el pedido. */
  body.con-pedido .wa-flotante{display:none}
  body.con-pedido footer{padding-bottom:120px}
  @media (max-width:560px){
    .barra-pedido{padding:10px 14px;gap:10px}
    .bp-ver{padding:9px 11px;gap:6px;font-size:9.5px}
    .bp-enviar{padding:12px 16px}
    .bp-total b{font-size:17px}
  }

  /* Lista del pedido */
  #pedido .caja{width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto}
  .pd-item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
  .pd-item:first-of-type{border-top:0}
  .pd-foto{width:46px;height:46px;flex:none;border-radius:9px;background:var(--foto-bg);
           object-fit:contain;padding:4px}
  .pd-txt{flex:1;min-width:0}
  .pd-txt b{display:block;font:400 13px/1.25 var(--display);text-transform:uppercase;letter-spacing:.01em}
  .pd-txt i{display:block;font:500 10px/1.4 var(--mono);color:var(--faint);font-style:normal;margin-top:3px}
  .pd-txt .pd-color{display:block;font:500 10px/1.4 var(--mono);color:var(--glow);margin-top:3px}
  .pd-precio{font:500 13px/1 var(--mono);color:var(--ink);white-space:nowrap;text-align:right}
  /* El precio unitario solo aparece cuando hay más de una unidad: con una sola
     repetiría el número de arriba. */
  .pd-precio i{display:block;font:500 10px/1.4 var(--mono);color:var(--faint);font-style:normal;margin-top:3px}
  .pd-item .stepper{flex:none}
  .pd-item .stepper button{width:26px;height:26px;font-size:15px}
  .pd-item .stepper .n{min-width:22px;font-size:13px}
  @media (max-width:520px){
    .pd-item{flex-wrap:wrap}
    .pd-txt{flex:1 1 100%;order:-1}
  }
  .pd-quitar{background:transparent;border:0;color:var(--faint);cursor:pointer;font-size:19px;
             line-height:1;padding:5px 8px;border-radius:8px;flex:none}
  .pd-quitar:hover{color:#FF8A8A;background:rgba(255,138,138,.1)}
  .pd-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
            border-top:1px solid var(--line);margin-top:6px;padding-top:14px}
  .pd-total span{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .pd-total b{font:400 24px/1 var(--display)}
  .pd-total i{display:block;font:500 12px/1 var(--mono);color:var(--muted);font-style:normal;margin-top:6px;text-align:right}
  .pd-vacio{color:var(--faint);font-size:13px;text-align:center;padding:22px 0}

  /* Cargando la tanda siguiente */
  .centinela{grid-column:1/-1;height:1px}

  /* ---------- Easter egg: 7 clics en el triángulo del logo ---------- */
  #egg{
    position:fixed;inset:0;z-index:999;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 45%, rgba(88,28,135,.94), rgba(10,7,16,.985));
    cursor:pointer;animation:eggIn .45s ease-out;text-align:center;padding:24px;
    backdrop-filter:blur(3px);
  }
  @keyframes eggIn{from{opacity:0}to{opacity:1}}
  #egg .saludo{
    font:400 clamp(1rem,3.2vw,1.9rem)/1.2 var(--display);
    text-transform:uppercase;color:rgba(255,255,255,.82);margin:0 0 4px;letter-spacing:.04em;
    animation:entra .5s .05s ease-out both;
  }
  #egg .frase{
    font:400 clamp(2.6rem,11vw,7rem)/0.92 var(--display);
    text-transform:uppercase;color:#fff;margin:0;letter-spacing:.005em;
    text-shadow:0 0 18px #A855F7, 0 0 46px #A855F7, 0 0 90px rgba(168,85,247,.75);
    /* Una sola animación por elemento: dos sobre el mismo se pisan y el texto
       queda congelado en opacidad 0. El latido va en el span de adentro. */
    animation:entra .5s .12s ease-out both;
  }
  #egg .frase span{display:inline-block;animation:latir 1.3s .8s ease-in-out infinite}
  #egg .gameplay{
    font:400 clamp(.95rem,2.7vw,1.55rem)/1.35 var(--display);
    text-transform:uppercase;color:rgba(255,255,255,.9);margin:16px auto 0;
    max-width:22ch;letter-spacing:.03em;
    animation:entra .5s .22s ease-out both;
  }
  #egg .gameplay b{color:var(--glow);font-weight:400;text-shadow:0 0 22px #A855F7}
  @keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes latir{50%{transform:scale(1.03)}}

  /* ---------- Variante El Primo: naranja de luchador ---------- */
  #egg.primo{background:radial-gradient(circle at 50% 45%, rgba(180,45,10,.95), rgba(18,6,2,.985))}
  #egg.primo .saludo{color:rgba(255,224,150,.9)}
  #egg.primo .frase{text-shadow:0 0 18px #FF7A18, 0 0 46px #FF4D00, 0 0 92px rgba(255,77,0,.75)}
  /* Entra de golpe, como un topetazo, en vez de subir suave.
     Una sola animación por elemento: dos se pisan y el texto no aparece. */
  #egg.primo .frase span{animation:topetazo .55s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes topetazo{
    0%{transform:scale(2.4) rotate(-7deg);opacity:0}
    55%{transform:scale(.92) rotate(2deg);opacity:1}
    100%{transform:none;opacity:1}
  }
  #egg.primo .gameplay b{color:#FFB34D;text-shadow:0 0 22px #FF7A18}
  #egg.primo .sub{color:#FFB34D}
  body.egg-on.primo-on header{filter:hue-rotate(-118deg) saturate(2) brightness(1.1)}
  #egg .sub{
    font:600 10.5px/1.9 var(--mono);letter-spacing:.28em;text-transform:uppercase;
    color:var(--glow);margin-top:20px;
  }
  #egg .cerrar{font:500 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
                color:rgba(243,238,255,.45);margin-top:34px}
  /* Mientras dura el egg, el resto de la página late en morado */
  body.egg-on header{filter:hue-rotate(-12deg) saturate(1.8) brightness(1.15)}
  @media (prefers-reduced-motion: reduce){
    #egg,#egg .saludo,#egg .frase,#egg .frase span,#egg .gameplay{animation:none}
  }

  /* ---------- El Primo, bailando ----------
     El personaje es el render oficial del juego (assets/el-primo.webp, con
     fondo transparente): dibujado a mano nunca iba a verse realista. Como es
     una sola imagen no se le mueven los brazos por separado, así que el baile
     sale del conjunto — rebote con squash y balanceo. Cada capa lleva UNA
     animación, dos sobre el mismo elemento se pisan. Todo cuelga de --beat:
     cambiando ese número baila más rápido o más lento. */
  #egg.primo,#egg.vegetta{--beat:.46s;overflow:hidden;align-items:end}

  .egg-escena{
    position:absolute;inset:auto -24px -24px;display:flex;justify-content:center;
    pointer-events:none;
    animation:eggEntra calc(var(--beat)*1.6) cubic-bezier(.25,.9,.3,1.2) both;
  }
  /* Se levanta desde abajo, como entrando al ring */
  @keyframes eggEntra{
    0%{transform:translateY(42%) scale(.93);opacity:0}
    45%{opacity:1}
    72%{transform:translateY(0) scale(1);opacity:1}
    84%{transform:translateY(0) scale(1.03,.95)}
    100%{transform:none;opacity:1}
  }
  .egg-sway{transform-origin:50% 100%;animation:eggSway calc(var(--beat)*4) ease-in-out infinite}
  @keyframes eggSway{
    0%,100%{transform:translateX(-1.2%) rotate(-2.6deg)}
    50%{transform:translateX(1.2%) rotate(2.6deg)}
  }
  /* Apenas atenuado y con sombra propia: el render es muy saturado y el texto
     se le pierde encima. */
  .egg-fig{
    /* Los dos límites en unidades de pantalla, no en %: el div del balanceo
       se ajusta a la imagen, así que un max-width:100% se mediría contra ella
       misma y no limitaría nada. Con height/width auto nunca se deforma. */
    max-height:88vh;max-width:94vw;height:auto;width:auto;display:block;
    transform-origin:50% 100%;
    animation:eggBote calc(var(--beat)*2) ease-in-out infinite;
  }
  @keyframes eggBote{
    0%,100%{transform:translateY(0) scale(1,1)}
    25%{transform:translateY(-2.4%) scale(.985,1.03)}
    50%{transform:translateY(0) scale(1.03,.965)}
    75%{transform:translateY(-1.3%) scale(.99,1.015)}
  }
  /* El Primo es un render 3D muy saturado: se atenúa para que el texto se
     lea encima. El skin de Vegetta es pixel art, y sin image-rendering el
     navegador lo interpola y queda borroso al agrandarlo. */
  #egg.primo .egg-fig{
    filter:brightness(.84) saturate(1.04) drop-shadow(0 16px 32px rgba(0,0,0,.6));
  }
  #egg.vegetta .egg-fig{
    max-height:78vh;image-rendering:pixelated;
    filter:brightness(.9) drop-shadow(0 16px 32px rgba(0,0,0,.65));
  }
  #egg.vegetta .frase{text-shadow:
    0 0 18px #A855F7, 0 0 46px #A855F7, 0 0 90px rgba(168,85,247,.75),
    0 6px 26px rgba(0,0,0,.85)}
  #egg.vegetta .saludo,#egg.vegetta .gameplay,#egg.vegetta .sub,
  #egg.vegetta .cerrar{text-shadow:0 2px 14px rgba(0,0,0,.9), 0 0 34px rgba(0,0,0,.7)}
  #egg.vegetta .saludo,#egg.vegetta .frase,#egg.vegetta .gameplay,
  #egg.vegetta .sub,#egg.vegetta .cerrar{position:relative}
  #egg.vegetta .saludo{animation-delay:calc(var(--beat)*1.3)}
  #egg.vegetta .frase{animation-delay:calc(var(--beat)*1.45)}
  #egg.vegetta .frase span{animation-delay:calc(var(--beat)*1.45)}
  #egg.vegetta .gameplay{animation-delay:calc(var(--beat)*1.7)}

  /* El texto se apoya sobre el cuerpo: necesita sombra para no perderse.
     Va en capa posicionada para quedar por encima del render. */
  #egg.primo .frase{
    font-size:clamp(1.9rem,7.6vw,4.6rem);line-height:.96;
    text-shadow:
      0 0 18px #FF7A18, 0 0 46px #FF4D00, 0 0 92px rgba(255,77,0,.75),
      0 6px 26px rgba(0,0,0,.85);
  }
  #egg.primo .saludo,#egg.primo .gameplay,#egg.primo .sub,#egg.primo .cerrar{
    text-shadow:0 2px 14px rgba(0,0,0,.9), 0 0 34px rgba(0,0,0,.7)}
  #egg.primo .saludo,#egg.primo .frase,#egg.primo .gameplay,
  #egg.primo .sub,#egg.primo .cerrar{position:relative}
  /* El aterrizaje sacude toda la pantalla del egg */
  #egg.primo>div,#egg.vegetta>div{padding-bottom:5vh;
    animation:eggImpacto .5s calc(var(--beat)*1.15) ease-out both}
  @keyframes eggImpacto{
    0%,100%{transform:none}
    12%{transform:translate(8px,-7px)}
    30%{transform:translate(-9px,6px)}
    48%{transform:translate(7px,4px)}
    66%{transform:translate(-5px,-3px)}
    84%{transform:translate(3px,1px)}
  }
  /* El texto espera a que entre, si no le habla a un escenario vacío */
  #egg.primo .saludo{animation-delay:calc(var(--beat)*1.3)}
  #egg.primo .frase{animation-delay:calc(var(--beat)*1.45)}
  #egg.primo .frase span{animation-delay:calc(var(--beat)*1.45)}
  #egg.primo .gameplay{animation-delay:calc(var(--beat)*1.7)}

  /* En el celular el Primo entero se come la pantalla y el dedo toca el
     borde: baja un escalón para que respire y le quede lugar al texto. */
  @media (max-width:560px){
    .egg-fig{max-height:70vh}
  }
  @media (prefers-reduced-motion: reduce){
    .egg-escena,.egg-sway,.egg-fig,#egg.primo>div,#egg.vegetta>div{animation:none}
  }
</style>
</head>

<script>
/* ==========================================================================
   CONFIGURACIÓN — lo único que tenés que tocar
   ========================================================================== */

// ID de tu planilla (lo que va entre /d/ y /edit en la URL)
const SHEET_ID  = '1pXNtSTiHeyQYM-gyzMbmL-76YwQZNrOGm4ujy4xRElk';
// gid de la pestaña (el número al final de la URL, después de #gid=)
const SHEET_GID = '705084569';

// Tu WhatsApp con código de país, solo números
const WHATSAPP = '5491122620770';   // +54 9 11 2262-0770

// ---------- PRECIOS EN PESOS ----------
//
// true  = muestra "USD 815" y abajo "$ 1.271.400"
// false = solo dólares
const MOSTRAR_PESOS = true;

// A qué cotización convertís. Dos opciones:
//   'auto'  → la trae sola de dolarapi.com, se actualiza sin que hagas nada
//   1600    → un número fijo que ponés vos y no cambia hasta que lo edites
const COTIZACION = 'auto';

// Solo si COTIZACION es 'auto'. Cuál de las cotizaciones usar:
//   'blue' · 'oficial' · 'bolsa' · 'cripto' · 'mayorista' · 'tarjeta' · 'contadoconliqui'
const COTIZACION_TIPO = 'blue';

// Recargo sobre la cotización, si vendés arriba del dólar de referencia.
// Se aplican los dos: primero el porcentaje, después los pesos fijos.
//   RECARGO_PCT = 5  → un 5% más caro que la cotización
//   RECARGO_FIJO = 20 → veinte pesos más por cada dólar
// Con blue en 1565 y estos valores: 1565 + 20 = 1585 por dólar.
const RECARGO_PCT  = 0;
const RECARGO_FIJO = 20;

// ---------- FOTOS ----------
//
// A) Columna "Imagen" en el Sheet con el link completo. Tiene prioridad.
// B) Por carpeta (menos trabajo): subís las fotos nombradas con el ID del
//    producto (CEL-APP-004.jpg) y poné acá la carpeta, terminada en barra.
//    Vacío = desactivado.
const CARPETA_FOTOS = 'fotos/';
const EXT_FOTOS = '.jpg';

// ⚠️ Solo aplica si la planilla trae "Costo USD" en vez de "Precio USD".
// Con null la web NO muestra ningún número (pone "Consultar"), para que no se
// te escape un costo por accidente.
const MARGEN_PCT = null;

// Cada cuántos minutos se refresca solo el catálogo
const REFRESCO_MIN = 5;

/* ========================================================================== */

// Dos formas de leer el mismo Sheet. Si la primera falla, se prueba la segunda.
// El "headers=1" es obligatorio: sin eso Google adivina mal dónde termina el
// encabezado y devuelve todo el catálogo aplastado en una sola celda.
const FUENTES = [
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&gid=${SHEET_GID}`,
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`
];

const $ = id => document.getElementById(id);
const grid = $('grid');

let PRODUCTOS = [];         // una entrada por fila de la planilla (las variantes)
let MODELOS   = [];         // una entrada por modelo: lo que se dibuja en la grilla
let CON_FOTOS = false;
let TC = null;              // cotización efectiva (número) o null si no hay
// Cómo sale ordenada la grilla si no pedís otra cosa. Cambiándolo por 'sheet'
// el catálogo vuelve a respetar el orden crudo de las filas de la planilla.
const ORDEN_DEF = 'modelo';
const filtros = { q:'', cat:'', marca:'', orden:ORDEN_DEF, soloStock:false,
                  rango:'', montura:'', apertura:'' };

// Tramos de precio. Los cortes salen de cómo está repartido el catálogo, no de
// números redondos porque sí: hasta 200 entran los accesorios, entre 500 y 2000
// vive más de la mitad de la lista, y arriba de 5000 quedan seis productos.
const RANGOS = [
  ['0-200',     'Hasta USD 200',           0,      200],
  ['200-500',   'USD 200 a 500',         200,      500],
  ['500-1000',  'USD 500 a 1.000',       500,     1000],
  ['1000-2000', 'USD 1.000 a 2.000',    1000,     2000],
  ['2000-5000', 'USD 2.000 a 5.000',    2000,     5000],
  ['5000+',     'Más de USD 5.000',     5000, Infinity],
];

/* ---------- Utilidades ---------- */

// Saca acentos y pasa a minúsculas: buscás "camara" y encuentra "Cámara"
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
// Los campos vacíos en la planilla vienen como "—" o "-"
const limpio = s => { const v=(s||'').trim(); return (v==='—'||v==='-'||v==='–') ? '' : v; };
const esSi = s => norm(s).startsWith('s');
const plata = n => n.toLocaleString('es-AR',{maximumFractionDigits:0});
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Solo http(s): evita que un texto raro en la columna Imagen genere un src peligroso
function urlFoto(u){
  if(!u) return '';
  try{ const p = new URL(u.trim(), document.baseURI);
       return (p.protocol==='http:'||p.protocol==='https:') ? p.href : ''; }
  catch{ return ''; }
}

// Parser de CSV que respeta comillas — las descripciones tienen comas
// y comillas de pulgadas (ej: 13.6")
function parseCSV(txt){
  const filas=[]; let fila=[], campo='', enComillas=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(enComillas){
      if(c==='"'){ if(txt[i+1]==='"'){campo+='"';i++;} else enComillas=false; }
      else campo+=c;
    }else{
      if(c==='"') enComillas=true;
      else if(c===','){ fila.push(campo); campo=''; }
      else if(c==='\n'){ fila.push(campo); filas.push(fila); fila=[]; campo=''; }
      else if(c!=='\r') campo+=c;
    }
  }
  if(campo!=='' || fila.length){ fila.push(campo); filas.push(fila); }
  return filas;
}

/* ---------- Cotización del dólar ---------- */

/* La configuración de arriba son los valores POR DEFECTO. El botón ⚙ del
   encabezado los pisa y guarda tu elección en este navegador. */
const CFG_KEY = 'advtecno.cotizacion';

function cfgPorDefecto(){
  return {
    modo:    typeof COTIZACION === 'number' ? 'manual' : 'auto',
    valor:   typeof COTIZACION === 'number' ? COTIZACION : null,
    tipo:    COTIZACION_TIPO,
    recargo: RECARGO_PCT,
    recargoFijo: RECARGO_FIJO
  };
}
function leerCfg(){
  try{ return { ...cfgPorDefecto(), ...JSON.parse(localStorage.getItem(CFG_KEY) || '{}') }; }
  catch{ return cfgPorDefecto(); }   // navegador con el almacenamiento bloqueado
}
function guardarCfg(c){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch{} }
function borrarCfg(){ try{ localStorage.removeItem(CFG_KEY); }catch{} }

let CFG = leerCfg();

// Aplica los recargos y deja escrito en el pie con qué número se calculó,
// para que el cliente pueda hacer la cuenta y no haya sorpresas.
function aplicarRecargo(base, etiqueta){
  const pct  = Number(CFG.recargo) || 0;
  const fijo = Number(CFG.recargoFijo) || 0;
  const final = base * (1 + pct/100) + fijo;
  const extra = (pct ? ` +${pct}%` : '') + (fijo ? ` +$${plata(fijo)}` : '');
  $('pie-cotiz').textContent = extra
    ? `${etiqueta}: $${plata(base)}${extra} = $${plata(Math.round(final))} · `
    : `${etiqueta}: $${plata(base)} · `;
  return final;
}

async function traerCotizacion(){
  if(!MOSTRAR_PESOS) return null;

  // Cotización fija puesta a mano
  if(CFG.modo === 'manual'){
    const v = Number(CFG.valor);
    if(!v || v <= 0){ $('pie-cotiz').textContent = ''; return null; }
    return aplicarRecargo(v, 'Cotización usada');
  }
  // Automática
  try{
    const r = await fetch(`https://dolarapi.com/v1/dolares/${CFG.tipo}`);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const venta = Number(d.venta);
    if(!venta) throw new Error('sin valor de venta');
    return aplicarRecargo(venta, `Dólar ${d.nombre || CFG.tipo}`);
  }catch(e){
    // Si falla, se muestran solo los dólares. Nunca un precio en pesos inventado.
    console.warn('No se pudo traer la cotización:', e);
    $('pie-cotiz').textContent = '';
    return null;
  }
}

/* ---------- Panel de cotización (botón ⚙) ---------- */

/* Todo lo que se abre encima de la página pasa por acá: se cierra con Escape,
   tocando afuera o con su botón, no deja escapar el tabulador fuera de la
   ventana y devuelve el foco a donde estaba. */
function montarModal(d, alCerrar){
  const previo = document.activeElement;
  document.body.appendChild(d);
  document.body.classList.add('modal-abierto');

  const cerrar = () => {
    if(!d.isConnected) return;
    d.remove();
    if(!document.querySelector('.modal')) document.body.classList.remove('modal-abierto');
    document.removeEventListener('keydown', porTecla);
    try{ previo?.focus({preventScroll:true}); }catch{}
    alCerrar?.();
  };

  const focusables = () => [...d.querySelectorAll(
      'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])')]
    .filter(x => x.offsetParent !== null);

  const porTecla = e => {
    if(e.key === 'Escape'){ e.preventDefault(); cerrar(); return; }
    if(e.key !== 'Tab') return;
    const f = focusables();
    if(f.length < 2) return;
    const pri = f[0], ult = f[f.length-1];
    const caja = d.querySelector('.caja') || d;
    // Shift+Tab parado en la ventana misma: va al último, no se escapa afuera
    if(e.shiftKey && document.activeElement === caja){ e.preventDefault(); ult.focus(); }
    else if(e.shiftKey && document.activeElement === pri){ e.preventDefault(); ult.focus(); }
    else if(!e.shiftKey && document.activeElement === ult){ e.preventDefault(); pri.focus(); }
  };
  document.addEventListener('keydown', porTecla);
  d.addEventListener('click', e => { if(e.target === d) cerrar(); });

  // El foco va a la ventana, no al primer botón: en la lista del pedido el
  // primero es la ✕ de borrar, y un Enter sin querer te vaciaba un producto.
  const caja = d.querySelector('.caja') || d;
  caja.tabIndex = -1;
  requestAnimationFrame(() => caja.focus({preventScroll:true}));
  return cerrar;
}
