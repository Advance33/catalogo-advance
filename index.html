/* ---------- ¿Hay fotos de verdad en la carpeta? ----------
   En modo carpeta la web no sabe de antemano qué archivos existen: arma la URL
   con el ID y listo. Si diéramos por hecho que todas existen, con la carpeta
   vacía saldrían cientos de recuadros grises. Así que probamos a cargar las
   primeras: alcanza con que UNA ande para pasar al diseño con imágenes.
   Por eso conviene cargar las fotos empezando por arriba de la planilla.      */

function probarFotos(prods, cuantas = 40, esperaMax = 4000){
  const muestra = prods.slice(0, cuantas).filter(p => p.imagen);
  if(!muestra.length) return Promise.resolve(false);

  return new Promise(resolve => {
    let pendientes = muestra.length, resuelto = false;
    const fin = ok => {
      if(resuelto) return;
      if(ok){ resuelto = true; resolve(true); return; }
      if(--pendientes === 0){ resuelto = true; resolve(false); }
    };
    // Si la red se cuelga, no dejamos la página esperando para siempre
    setTimeout(() => { if(!resuelto){ resuelto = true; resolve(false); } }, esperaMax);
    muestra.forEach(p => {
      const im = new Image();
      im.onload  = () => fin(true);
      im.onerror = () => fin(false);
      im.src = p.imagen;
    });
  });
}

/* ---------- Carga de datos ---------- */

async function bajarCSV(){
  let ultimoError;
  for(const url of FUENTES){
    try{
      // El &_= evita que el navegador devuelva una copia vieja en caché
      const res = await fetch(url + '&_=' + Date.now());
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const txt = await res.text();
      // Si Google devolvió HTML en vez de CSV, la planilla no es pública
      if(/^\s*</.test(txt)) throw new Error('la planilla no es pública');
      return txt;
    }catch(e){ ultimoError = e; }
  }
  throw ultimoError;
}

async function cargar(){
  const filas = parseCSV(await bajarCSV()).filter(f => f.some(c => c.trim()));
  if(filas.length < 2) throw new Error('la planilla vino vacía');

  // Ubico cada columna por su nombre, así no se rompe si reordenás la planilla
  const cab = filas[0].map(norm);
  const col = (...nombres) => {
    for(const n of nombres){
      const i = cab.findIndex(h => h === norm(n) || h.startsWith(norm(n)));
      if(i !== -1) return i;
    }
    return -1;
  };
  const C = {
    id:col('id'), cat:col('categoria'), marca:col('marca'), modelo:col('modelo'),
    desc:col('descripcion completa','descripcion'),
    precio:col('precio usd','precio'), costo:col('costo usd','costo'),
    color:col('color'), stock:col('stock'), busq:col('terminos de busqueda'),
    fecha:col('ultima actualizacion'), activo:col('activo'), incluye:col('incluye'),
    imagen:col('imagen','foto','image','url imagen'),
    // Columnas opcionales: si algún día las agregás a la planilla, aparecen
    // solas en la ficha del producto. Si no están, no pasa nada.
    detalle:col('detalle','especificaciones','specs','ficha'),
    garantia:col('garantia'),
    condicion:col('condicion','estado'),
    // Si dos filas llevan el mismo texto acá, van juntas en la misma tarjeta.
    // Es la forma de corregir a mano lo que el agrupado automático no acierte.
    grupo:col('grupo','familia')
  };

  const esCosto = C.precio === -1 && C.costo !== -1;
  const iPrecio = C.precio !== -1 ? C.precio : C.costo;
  const val = (f,i) => i === -1 ? '' : limpio(f[i]);
  const num = s => parseFloat(String(s).replace(/[^\d.,-]/g,'').replace(',','.')) || 0;

  return filas.slice(1)
    // Fuera las filas separadoras decorativas ("━━━ CELULAR · IPHONE 📱 ━━━"):
    // se reconocen porque solo tienen contenido en la primera celda
    .filter(f => f.slice(1).some(c => c.trim()))
    .map((f,i) => {
      const base = num(val(f, iPrecio));
      const id = val(f,C.id);
      return {
        idx:i, id,
        cat:    categoriaReal(val(f,C.cat), val(f,C.marca), val(f,C.desc)),
        grupo:  val(f,C.grupo),
        marca:  val(f,C.marca),
        modelo: val(f,C.modelo),
        desc:   val(f,C.desc) || val(f,C.modelo),
        precio: !esCosto ? base
              : (MARGEN_PCT === null || MARGEN_PCT === undefined) ? null
              : Math.round(base * (1 + MARGEN_PCT/100)),
        // Si la columna Color está vacía, se buscan los colores en el paréntesis
        // del nombre, que es donde los carga la mitad de la planilla.
        color:  val(f,C.color) || colorDelParentesis(val(f,C.desc) || val(f,C.modelo)),
        stock:  esSi(val(f,C.stock)),
        busq:   val(f,C.busq),
        fecha:  val(f,C.fecha),
        incluye:val(f,C.incluye),
        detalle:  val(f,C.detalle),
        garantia: val(f,C.garantia),
        condicion:val(f,C.condicion),
        // Primero la columna Imagen; si está vacía, se prueba con la carpeta
        // usando el ID. Si el archivo no existe, el onerror muestra el placeholder.
        imagen: urlFoto(val(f,C.imagen)) ||
                (CARPETA_FOTOS && id ? urlFoto(CARPETA_FOTOS + encodeURIComponent(id) + EXT_FOTOS) : ''),
        activo: C.activo === -1 || val(f,C.activo) === '' || esSi(val(f,C.activo))
      };
    })
    .filter(p => p.activo && p.desc)
    // Se deducen una vez al cargar, no en cada tecla del buscador: son dos
    // expresiones regulares por producto sobre una lista de 472.
    .map(p => { p.montura = monturaDe(p); p.apertura = aperturaDe(p); return p; });
  // Si la planilla tuviera "Proveedor" o "Costo USD", esos campos nunca se copian
  // acá. Lo que no existe en este objeto no puede filtrarse a la web.
}

/* ---------- Filtrado ---------- */

function filtrar(){
  const palabras = norm(filtros.q) ? norm(filtros.q).split(/\s+/) : [];

  const out = MODELOS.filter(p => {
    if(filtros.cat   && p.cat   !== filtros.cat)   return false;
    if(filtros.marca && p.marca !== filtros.marca) return false;
    // Con que UNA variante tenga stock, el modelo se muestra
    if(filtros.soloStock && !p.stock)              return false;
    if(filtros.montura  && p.montura  !== filtros.montura)  return false;
    if(filtros.apertura && p.apertura !== filtros.apertura) return false;
    if(filtros.rango){
      const r = RANGOS.find(x => x[0] === filtros.rango);
      // El modelo entra si CUALQUIERA de sus variantes cae en el tramo: un iPad
      // de 510 a 760 tiene que aparecer tanto en "hasta 200-500" como arriba.
      // Los "Consultar" no tienen precio, así que no caen en ningún tramo.
      if(r && !p.variantes.some(v => v.precio !== null && v.precio >= r[2] && v.precio < r[3]))
        return false;
    }
    if(!palabras.length) return true;
    const heno = norm([p.desc,p.marca,p.modelo,p.cat,p.busq,p.color,p.id].join(' '));
    return palabras.every(w => heno.includes(w));
  });

  const porNombre = (a,b) => a.desc.localeCompare(b.desc,'es');
  // Los precios en null ("Consultar") van al final. El x===y evita
  // Infinity - Infinity, que da NaN y rompe el sort.
  const pr = p => p.precio === null ? Infinity : p.precio;
  const porPrecio = (a,b) => { const x=pr(a), y=pr(b); return x===y ? 0 : x-y; };
  /* Marca y modelo. La planilla se fue llenando por tandas, así que las cuatro
     PlayStation terminaron en las filas 86, 87, 402 y 446 y en la grilla salían
     desparramadas entre medio de las Switch y las Xbox. Acá cada marca queda
     entera y sus modelos correlativos.
     Las categorías y las marcas NO se ordenan alfabéticamente: van en el orden
     en que aparecen en la planilla, así lo que pusiste primero sigue primero.
     Lo único alfabético es el modelo dentro de su marca, y se compara sin
     espacios ni acentos porque la misma consola está escrita de las dos formas
     ("PlayStation 5 Pro" y "Play Station 5 Física"): con los espacios en el
     medio, una caía antes de la "P" y la otra después. */
  const claveModelo = p => norm(p.desc).replace(/[^a-z0-9]/g,'');
  const posCat = new Map(), posMarca = new Map();
  const kMarca = p => norm(p.cat) + '|' + norm(p.marca);
  out.forEach(p => {
    if(!posCat.has(norm(p.cat))) posCat.set(norm(p.cat), p.idx);
    if(!posMarca.has(kMarca(p))) posMarca.set(kMarca(p), p.idx);
  });
  const porMarcaModelo = (a,b) =>
    (posCat.get(norm(a.cat)) - posCat.get(norm(b.cat))) ||
    (posMarca.get(kMarca(a)) - posMarca.get(kMarca(b))) ||
    claveModelo(a).localeCompare(claveModelo(b),'es') ||
    (a.idx - b.idx);

  const orden = {
    modelo: porMarcaModelo,
    // El orden crudo de la planilla, por si querés acomodar algo a mano
    sheet:(a,b) => a.idx - b.idx,
    asc:  (a,b) => porPrecio(a,b) || porNombre(a,b),
    desc: (a,b) => porPrecio(b,a) || porNombre(a,b),
    az:   porNombre,
    cat:  (a,b) => a.cat.localeCompare(b.cat,'es') || porPrecio(a,b) || porNombre(a,b)
  }[filtros.orden];

  return out.sort((a,b) => (b.stock - a.stock) || orden(a,b));
}

/* ---------- Datos derivados de cada producto ---------- */

/* La planilla mete cosas distintas en la misma categoría: en "Tablet" conviven
   los iPad con las Samsung, y "Notebook" y "Smartwatch" hoy son 100% Apple.
   En vez de renombrar la categoría de una (que quedaría mintiendo el día que
   entre una notebook Asus), se parte por marca: lo de Apple va a su categoría
   propia y el resto se queda en la genérica. Si mañana la planilla trae una
   tablet Lenovo, cae sola en "Tablet" sin tocar nada acá. */
const CATS_APPLE = { tablet:'iPad', notebook:'MacBook', smartwatch:'Apple Watch' };

function categoriaReal(cat, marca, desc){
  const propia = CATS_APPLE[norm(cat)];
  if(!propia) return cat;
  // El iPad se reconoce por el nombre aunque la marca venga vacía o mal escrita
  const esApple = norm(marca) === 'apple' || /\bipad|macbook|apple watch\b/i.test(desc || '');
  return esApple ? propia : cat;
}

/* Los chips de la barra van en plural, pero SOLO ahí: el dato sigue en singular
   porque es lo que corresponde en la ficha de un producto ("Categoría: Celular")
   y porque es lo que viaja en el link (?cat=Celular). Las que no están en la
   lista se pluralizan con la regla de siempre. */
const CATS_PLURAL = {
  'Celular':'Celulares', 'Cámara':'Cámaras', 'Cámara de Acción':'Cámaras de Acción',
  'Lente':'Lentes', 'Tablet':'Tablets', 'iPad':'iPads', 'MacBook':'MacBooks',
  'Consola':'Consolas', 'Filmadora':'Filmadoras', 'Drone':'Drones', 'Desktop':'Desktops',
  'Accesorio Apple':'Accesorios Apple', 'Accesorio Cámara':'Accesorios Cámara',
  'Accesorio Drone':'Accesorios Drone', 'Accesorio Gaming':'Accesorios Gaming',
  // Estas ya funcionan como plural: "Apple Watchs" y "Auducularess" no existen
  'Apple Watch':'Apple Watch', 'Auriculares':'Auriculares'
};

function plural(cat){
  if(CATS_PLURAL[cat]) return CATS_PLURAL[cat];
  if(!cat) return cat;
  return /[aeiouáéíóú]$/i.test(cat) ? cat + 's' : cat + 'es';
}

/* La montura es LA pregunta del que compra un lente: "¿me entra en mi cámara?".
   No hay columna para eso, pero el nombre la trae casi siempre, en dos formatos
   según quién fabrique:
     · Canon, Sony y Nikon la ponen de prefijo   → "RF 50 F1,8", "FE 85 F/1.4"
     · Sigma y Tamron, de sufijo                 → "18-50 F/2.8 CONTEMPORARY CANON RF"
   Se prueba primero el sufijo porque es más específico: un Sigma "… CANON RF"
   empieza con el foco (18-50), no con la montura, y el prefijo no lo agarraría.
   Cubre 182 de los 195 lentes. Los que quedan afuera dicen solo "CANON", sin
   aclarar si es RF o EF: eso se arregla en la planilla, no acá. */
const MONTURAS_SUFIJO = [
  [/CANON\s+RF-?S/, 'Canon RF-S'], [/CANON\s+RF/,       'Canon RF'],
  [/CANON\s+EF-?M/, 'Canon EF-M'], [/CANON\s+EF-?S/,    'Canon EF-S'],
  [/CANON\s+(?:EF|AF)\b/, 'Canon EF'],
  [/SONY\s+FE/,     'Sony E'],     [/SONY\s+E\b/,       'Sony E'],  [/\bSONY\b/,  'Sony E'],
  [/NIKON\s+Z/,     'Nikon Z'],    [/\bNIKON\b/,        'Nikon F'],
  [/\bFUJI/,        'Fujifilm X'], [/\bL-?MOUNT\b/,     'L-Mount'],
];
const MONTURAS_PREFIJO = [
  [/^RF-?S\b/, 'Canon RF-S'], [/^RF\b/,        'Canon RF'],
  [/^EF-?M\b/, 'Canon EF-M'], [/^EF[\s-]?S\b/, 'Canon EF-S'], [/^EF\b/, 'Canon EF'],
  [/^FE\b/,    'Sony E'],     [/^E\b/,         'Sony E'],
  [/^Z\b/,     'Nikon Z'],    [/^AF-?S?\b/,    'Nikon F'],
];

const esLente = p => norm(p.cat) === 'lente';

function monturaDe(p){
  if(!esLente(p)) return '';
  // Los puntos y comas de "F/2,8" romperían los \b de las expresiones
  const t = (p.modelo || p.desc || '').toUpperCase().replace(/[.,]/g,' ').trim();
  for(const [re,m] of MONTURAS_SUFIJO)  if(re.test(t)) return m;
  for(const [re,m] of MONTURAS_PREFIJO) if(re.test(t)) return m;
  return '';
}

/* El eje "profesional vs básico" de la fotografía no es una opinión: es la
   apertura. De f/2.8 para abajo es vidrio luminoso, el que se usa para trabajar;
   de ahí para arriba es el de kit. Está en el nombre de 192 de los 195 lentes. */
function aperturaDe(p){
  if(!esLente(p)) return '';
  const m = /F\s*\/?\s*(\d+(?:[.,]\d+)?)/i.exec(p.modelo || p.desc || '');
  if(!m) return '';
  return parseFloat(m[1].replace(',','.')) <= 2.8 ? 'luminoso' : 'cerrado';
}

// Cómo lo identificamos en el pedido y en el link compartido. Casi todos
// tienen ID; si alguna fila viniera sin él, usamos su posición en la planilla.
const clave = p => p.id || ('#' + p.idx);
const buscarProducto = k => PRODUCTOS.find(p => clave(p) === k);

const precioUSD = p => p.precio === null ? 'Consultar' : 'USD ' + plata(p.precio);
const precioARS = p => (TC && p.precio) ? '$ ' + plata(Math.round(p.precio * TC)) : '';

// El mensaje sale igual desde la tarjeta, la ficha y el pedido
// El mensaje que el cliente manda al tocar Consultar. Sin código interno y sin
// precio: tiene que sonar a una persona escribiendo, no a un formulario. Termina
// en pregunta, que es lo que invita a contestar.
function mensajeWA(p, color){
  return `Hola! Me interesa el ${p.desc}${color ? ` en ${color}` : ''}. ¿Me pasás info?`;
}
const linkWA = texto => WHATSAPP ? `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(texto)}` : '';

/* Especificaciones deducidas del nombre del producto.
   La planilla no tiene columnas de specs, pero la descripción sí las trae
   escritas ("SAMSUNG A56 12/256GB 5G"). En vez de pedirte que cargues 483
   fichas a mano, las leemos de ahí. Si algún día agregás una columna
   "Detalle" a la planilla, esa manda y se muestra completa en la ficha. */
function specs(p){
  const txt = [p.desc, p.modelo].filter(Boolean).join(' ');
  const out = [];
  const add = v => { if(v && !out.includes(v)) out.push(v); };

  // "12/256GB" = memoria RAM / almacenamiento, como lo escriben los fabricantes
  const dual = /(\d{1,2})\s*\/\s*(\d{3,4})\s*GB\b/i.exec(txt);
  if(dual){ add(dual[1] + 'GB RAM'); add(dual[2] + 'GB'); }
  else{
    const tb = /(\d(?:[.,]\d)?)\s*TB\b/i.exec(txt);
    const gb = /(?:^|[\s(/])(\d{2,4})\s*GB\b/i.exec(txt);
    if(tb)      add(tb[1].replace(',','.') + 'TB');
    else if(gb) add(gb[1] + 'GB');
  }
  const chip = /\b(M\d(?:\s+(?:PRO|MAX|ULTRA))?)\b/i.exec(txt);      // chips Apple
  if(chip) add('Chip ' + chip[1].toUpperCase());
  const pulg = /(\d{1,2}(?:[.,]\d)?)\s*(?:"|''|pulgadas)/i.exec(txt);
  if(pulg) add(pulg[1].replace(',','.') + '"');
  if(/\be-?sim\b/i.test(txt)) add('eSIM');
  if(/\b5G\b/i.test(txt))     add('5G');
  const mp = /\b(\d{1,3})\s*MP\b/i.exec(txt);
  if(mp) add(mp[1] + ' MP');
  const w = /\b(\d{2,3})\s*W\b/.exec(txt);
  if(w) add(w[1] + 'W');
  return out;
}

// La <img> con su reemplazo por si el archivo no existe. Si el link está roto
// se cambia SOLO la <img>: usar parentNode.innerHTML borraría también el badge
// de stock, que es su hermano.
function htmlFoto(p, clase){
  const sinFoto = `<div class="sinfoto"><b>${esc(p.marca || 'Sin foto')}</b><i>sin imagen</i></div>`;
  if(!p.imagen) return sinFoto;
  return `<img src="${esc(p.imagen)}" alt="${esc(p.desc)}" ${clase || ''} decoding="async"
               onload="this.classList.add('ok')"
               onerror="this.outerHTML=this.dataset.alt" data-alt="${esc(sinFoto)}">`;
}
// En la grilla el badge solo aparece cuando FALTA stock: con 472 productos
// disponibles, "En stock" repetido 472 veces no distingue nada. En la ficha
// sí se muestra siempre, porque ahí el cliente está decidiendo la compra.
const htmlBadge = (p, siempre = false) =>
  (!p.stock || siempre)
    ? `<span class="badge ${p.stock?'si':'no'}">${p.stock?'En stock':'Sin stock'}</span>`
    : '';

/* ---------- Muestras de color ----------
   Muchos productos vienen en varios colores en una sola fila
   ("Midnight/Blue/Orange"), y la foto solo puede mostrar uno. Los puntitos
   dejan ver de un vistazo en qué colores viene, sin necesitar una foto por
   cada uno. Los colores que no están en esta lista salen solo como texto:
   preferimos no mostrar nada antes que inventar un color equivocado. */
const COLORES = {
  black:'#1D1D1F', bla:'#1D1D1F', 'jet black':'#0B0B0D', 'space black':'#2B2A2E',
  white:'#F5F5F7', whi:'#F5F5F7', cream:'#F3E9D8', pearl:'#EFE9E4',
  silver:'#D8DADC', whitesilver:'#E6E8EA', titanium:'#C6C2BC',
  'natural titanium':'#C7C0B6', 'white titanium':'#E8E6E1', 'desert titanium':'#C4A88A',
  natural:'#CFC7BA', gray:'#8E8E93', grey:'#8E8E93', 'space gray':'#6E6E73',
  graphite:'#5B5B5F', charcoal:'#3E3E42', graygreen:'#7E8A7C',
  blue:'#2C6BED', blu:'#2C6BED', 'light blue':'#8FC7F0', lightblue:'#8FC7F0',
  'sky blue':'#9DC3DE', skyblue:'#9DC3DE', silverblue:'#B6C6D4',
  'dark blue':'#1B3A6B', navy:'#22304C', 'anchor blue':'#38506B',
  ultramarine:'#3E4CD8', indigo:'#4B4B8F', 'rhythm blue':'#3F5C99',
  teal:'#4C9E9E', green:'#37A05A', gre:'#37A05A', 'dark green':'#1F5B37',
  'remix green':'#5FBF7A', sage:'#B2BFA5', olive:'#7A7F46',
  'laurel oak':'#6E7A5A', citrus:'#E8C55A', gold:'#E3C08D', 'light gold':'#EBD9B8',
  'rose gold':'#E0BFB4', orange:'#F07A24', pink:'#F2A9C0', pin:'#F2A9C0',
  'cherry pink':'#D94A6E', purple:'#8A4FD0', pur:'#8A4FD0', violet:'#8E6FE0',
  lavender:'#C3B2E8', 'techno red':'#C6303A', red:'#D8352E', brown:'#6B4A34',
  midnight:'#1E2434', astrobot:'#5A6B8C',
  starlight:'#EDE6DA', 'icy blue':'#BFDCE8', icyblue:'#BFDCE8', blush:'#E8B4B0',
  amethyst:'#8A5FA8', sapphire:'#2D5A9E',
  // Como vienen escritos en algunas filas de la planilla
  whites:'#F5F5F7', sil:'#D8DADC', jetblack:'#0B0B0D', negro:'#1D1D1F', violeta:'#8E6FE0'
};

// El tono de un nombre suelto, o null si no lo sabemos pintar. Si el nombre
// completo no está en la lista, probamos con la última palabra ("cherry pink"
// → "pink").
function hexColor(n){
  const k = norm(n);
  return COLORES[k] || COLORES[k.split(/\s+/).pop()] || null;
}

// "Midnight/Blue/Orange" → tres puntitos.
// Algunas filas separan con guión en vez de barra ("Black-Silver"). Ese corte
// se hace SOLO si los dos lados son colores conocidos: así "Rose-Gold" o
// "Space-Gray" siguen siendo un color y no dos.
function pintas(txt){
  return (txt||'').split('/').map(s => s.trim()).filter(Boolean)
    .flatMap(n => {
      const partes = n.split('-').map(s => s.trim()).filter(Boolean);
      return partes.length > 1 && partes.every(hexColor) ? partes : [n];
    })
    .map(n => ({ nombre:n, hex:hexColor(n) }));
}

/* Muchas filas dejan la columna Color vacía y ponen los colores entre
   paréntesis en el modelo: "Airpods Max USB-C (Purple/Starlight/Midnight)".
   Los rescatamos de ahí, pero solo cuando TODO lo que hay adentro del
   paréntesis son colores que sabemos pintar. Ese recaudo es lo que evita
   confundir "(CAJA DE KIT)", "(INGLES)", "(2ª Gen)" o "(MINI 3 PRO)" con un
   color: ante la duda, la fila se queda sin puntitos, como antes. */
const RE_PAREN_CAP = /\(([^)]*)\)/g;
function colorDelParentesis(desc){
  for(const m of String(desc||'').matchAll(RE_PAREN_CAP)){
    const lista = pintas(m[1].trim());
    if(lista.length && lista.every(c => c.hex)) return lista.map(c => c.nombre).join('/');
  }
  return '';
}
function htmlColores(txt){
  const lista = pintas(txt).filter(c => c.hex);
  if(!lista.length) return '';
  return `<span class="pintas">${lista.map(c =>
    `<i style="background:${c.hex}" title="${esc(c.nombre)}"></i>`).join('')}</span>`;
}

/* En la ficha los puntitos dejan de ser decoración y pasan a ser botones: el
   cliente elige el color, queda marcado, viaja al pedido y al mensaje de
   WhatsApp. Acá se muestran TODOS los colores de la fila, también los que no
   están en la lista de hex (esos van rayados): que no sepamos pintarlos no es
   motivo para que no se puedan elegir. */
function htmlColorFicha(p){
  const lista = pintas(p.color);
  // Con un solo color no hay nada que elegir: queda como estaba
  if(lista.length < 2) return htmlColores(p.color) + esc(p.color);

  const eleg = colorDe(clave(p));
  const puntos = lista.map(c =>
    `<button type="button" data-color="${esc(c.nombre)}"${c.hex ? ` style="background:${c.hex}"` : ' class="sinhex"'}
             aria-pressed="${eleg === c.nombre}" title="${esc(c.nombre)}"
             aria-label="Elegir ${esc(c.nombre)}"></button>`).join('');

  return `<div class="fi-pintas">${puntos}</div>
    <span class="fi-color-elegido" id="fi-color-txt">${eleg ? `<b>${esc(eleg)}</b>` : esc(p.color)}</span>
    <span class="fi-hint" id="fi-color-hint"${eleg ? ' hidden' : ''}>Tocá un color para elegirlo</span>`;
}

/* Foto por color. La planilla trae una sola foto por producto, así que la del
   color se busca por convención de nombre: fotos/<ID>-<color>.jpg — por
   ejemplo CEL-APP-066-black.jpg o CEL-APP-066-space-gray.jpg. Se pide recién
   cuando el cliente toca el puntito (si no, serían cinco pedidos fallidos cada
   vez que se abre una ficha) y la foto se cambia solo si el archivo existe:
   sin foto de ese color queda la principal y no se ve nada roto. */
const slugColor = s => norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

function fotoDeColor(p, color){
  const s = slugColor(color || '');
  if(!CARPETA_FOTOS || !p.id || !s) return '';
  return urlFoto(CARPETA_FOTOS + encodeURIComponent(p.id + '-' + s) + EXT_FOTOS);
}

function mostrarFotoColor(p, color, d){
  const img = d.querySelector('.fi-foto img');
  if(!img) return;                                    // ficha sin foto: nada que cambiar
  const volver = () => { if(p.imagen && img.getAttribute('src') !== p.imagen) img.src = p.imagen; };
  const url = fotoDeColor(p, color);
  if(!url) return volver();
  const prueba = new Image();
  prueba.onload  = () => { img.src = url; img.classList.add('ok'); };
  prueba.onerror = volver;
  prueba.src = url;
}

// El mismo control de unidades sirve en la ficha y en la lista del pedido
function htmlStepper(n){
  return `<div class="stepper">
    <button type="button" data-d="-1" aria-label="Quitar una unidad">&minus;</button>
    <span class="n" aria-live="polite">${n}</span>
    <button type="button" data-d="1" aria-label="Agregar una unidad"${n >= MAX_CANT ? ' disabled' : ''}>+</button>
  </div>`;
}

// Los dos íconos del botón de pedido viajan juntos; el CSS muestra el que va
// según aria-pressed. Así el cambio es instantáneo, sin volver a dibujar nada.
const ICONO_WA = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.18 8.18 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.19 8.19 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.78.97-.15.16-.29.18-.54.06-.25-.13-1.05-.39-1.99-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.38.11-.5.11-.11.25-.29.37-.44.13-.15.17-.25.25-.42.09-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.47c-.16 0-.43.06-.65.31-.22.25-.85.84-.85 2.03 0 1.2.87 2.35.99 2.51.12.17 1.71 2.62 4.15 3.67.58.25 1.03.4 1.39.51.58.19 1.11.16 1.53.1.47-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.11-.22-.17-.47-.29Z"/></svg>`;

const ICONO_MAS = `
  <svg class="i-mas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <svg class="i-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;

/* ---------- Agrupar las variantes de un mismo modelo ----------
   La planilla trae una fila por combinación: el iPad 11 A16 ocupa tres (128,
   256 y 512gb) y el Apple Watch Series 11 siete. Como tarjetas sueltas el
   cliente ve el mismo producto repetido, y encima a veces separado en la
   grilla. Acá las juntamos: una tarjeta por modelo, y adentro de la ficha se
   elige la variante, que es la que tiene el precio y el ID de verdad.

   Ojo con el alcance de las reglas: la capacidad y la RAM se sacan en todas
   las categorías, pero la medida en mm y las correas SOLO en los relojes. En
   un lente "100-400mm" es el foco, no una variante, y agrupar por ahí juntaría
   lentes que no tienen nada que ver. */

const RE_CAP   = /\b\d+(?:[.,]\d+)?\s*(?:gb|tb)\b/gi;   // 128gb, 1tb
const RE_RAM   = /\b\d+\s*ram\b/gi;                     // 16ram
const RE_DUAL  = /\b\d{1,2}\s*\/\s*\d{3,4}\s*gb\b/gi;   // 12/256GB
const RE_PAREN = /\([^)]*\)/g;                          // (Space Gray/Silver)
const RE_CORCH = /\[[^\]]*\]/g;                         // [5G]
// Solo relojes:
const RE_MM     = /\b\d{2}\s*mm\b/gi;
const RE_TALLE  = /\b[SML](?:\/[SML])?(?:-[SML](?:\/[SML])?)?\b/g;
const RE_CORREA = /\b(?:sport band|ocean band|alpine loop|milanese loop|trail loop|sport loop)\b/gi;
const RE_COLOR  = /\b(?:midnight|starlight|silver|space gray|rose gold|jet black|natural|anchor blue|dark green|black|gold|white|blue)\b/gi;

const esReloj = p => ['apple watch','smartwatch'].includes(norm(p.cat));

// Dos filas con la misma familia son el mismo modelo. La columna Grupo de la
// planilla, si está, manda sobre todo esto.
function familia(p){
  if(p.grupo) return 'G:' + norm(p.grupo);
  let t = (p.desc || '').replace(RE_PAREN,' ').replace(RE_CORCH,' ')
                        .replace(RE_DUAL,' ').replace(RE_CAP,' ').replace(RE_RAM,' ');
  if(esReloj(p))
    t = t.replace(RE_MM,' ').replace(RE_CORREA,' ').replace(RE_TALLE,' ').replace(RE_COLOR,' ');
  return [norm(p.cat), norm(p.marca), norm(t).replace(/[\s\-–/]+/g,' ').trim()].join('|');
}

// El nombre de la tarjeta es lo que todas las variantes tienen en común:
// "Apple iPad 11 A16 128gb" + "… 256gb" + "… 512gb" → "Apple iPad 11 A16".
function nombreGrupo(vs){
  if(vs.length === 1) return vs[0].desc;
  const pal = vs.map(v => (v.desc || '').split(/\s+/));
  const out = [];
  for(let i = 0, min = Math.min(...pal.map(w => w.length)); i < min; i++){
    if(!pal.every(w => norm(w[i]) === norm(pal[0][i]))) break;
    out.push(pal[0][i]);
  }
  const n = out.join(' ').replace(/[\s\-–(]+$/,'');
  // Un prefijo de una sola palabra no nombra nada ("Apple"): antes de mostrar
  // eso, preferimos el nombre completo de la primera variante.
  return n.split(/\s+/).filter(Boolean).length >= 2 ? n : vs[0].desc;
}

// Lo que distingue a esta variante de sus hermanas: "512gb", "16ram 1tb",
// "42mm Silver S/M". El paréntesis de color no entra, porque el color se elige
// aparte con los puntitos.
function etiquetaVariante(p, nombre){
  let e = p.desc || '';
  if(norm(e).startsWith(norm(nombre))) e = e.slice(nombre.length);
  e = e.replace(RE_PAREN,' ').replace(/[\s\-–]+/g,' ').trim();
  return e || p.color || 'Estándar';
}

function armarModelo(vs){
  const conPrecio = vs.filter(v => v.precio !== null);
  const precioMin = conPrecio.length ? Math.min(...conPrecio.map(v => v.precio)) : null;
  // El representante da la foto y los datos de la tarjeta. Elegimos el más
  // barato CON stock: es el que corresponde al "desde" que se muestra.
  const rep = vs.find(v => v.stock && v.precio === precioMin)
           || vs.find(v => v.precio === precioMin) || vs[0];
  const nombre = nombreGrupo(vs);
  vs.forEach(v => { v.etiqueta = etiquetaVariante(v, nombre); });

  // Dos variantes con la misma etiqueta serían dos botones idénticos con
  // precios distintos, y el cliente no tendría cómo saber cuál es cuál. Pasa
  // de verdad: el iPhone 17 Pro tiene dos filas de 256GB, una Blue/Orange a
  // USD 1.190 y otra Silver a USD 1.195. Se separan con el color.
  const cuenta = {};
  vs.forEach(v => { cuenta[v.etiqueta] = (cuenta[v.etiqueta] || 0) + 1; });
  vs.forEach(v => {
    if(cuenta[v.etiqueta] > 1 && v.color) v.etiqueta = `${v.etiqueta} · ${v.color}`;
  });

  const colores = [...new Set(
    vs.flatMap(v => (v.color || '').split('/').map(s => s.trim()).filter(Boolean)))];

  return {
    ...rep,                                    // hereda foto, incluye, detalle, categoría…
    idx:   Math.min(...vs.map(v => v.idx)),    // el grupo va donde estaba el primero
    desc:  nombre,
    precio: precioMin,                         // el "desde"
    precioMax: conPrecio.length ? Math.max(...conPrecio.map(v => v.precio)) : null,
    stock: vs.some(v => v.stock),              // con que una esté disponible, alcanza
    color: colores.join('/'),
    variantes: vs,
    rep,
    multi: vs.length > 1,
    // Que el buscador encuentre por la capacidad, el color o el ID de CUALQUIER
    // variante, aunque la tarjeta muestre otra.
    busq: [...new Set(vs.flatMap(v => [v.busq, v.desc, v.id, v.color]))].filter(Boolean).join(' ')
  };
}

function agrupar(prods){
  const mapa = new Map();
  prods.forEach(p => {
    const f = familia(p);
    if(!mapa.has(f)) mapa.set(f, []);
    mapa.get(f).push(p);
  });
  return [...mapa.values()].map(armarModelo).sort((a,b) => a.idx - b.idx);
}

// El modelo que contiene esta variante. Sirve para abrir la ficha desde un link
// viejo o desde el pedido, que guardan el ID de la variante.
const buscarModelo = k => MODELOS.find(m => m.variantes.some(v => clave(v) === k));

// El + de la tarjeta se marca si el cliente cargó CUALQUIERA de las variantes,
// no solo la que la tarjeta muestra de frente.
const enPedidoModelo = m =>
  (m.variantes || [m]).some(v => enPedido(clave(v)));

// Cuando las variantes no valen lo mismo, el precio de la tarjeta es un "desde"
const precioTarjeta = m => {
  if(!m.multi || m.precio === null || m.precio === m.precioMax) return precioUSD(m);
  return `<i class="desde">desde</i> ${precioUSD(m)}`;
};

// Las opciones, resumidas en un renglón: "128gb · 256gb · 512gb". Si las
// etiquetas son largas (los relojes son "42mm Silver S/M") no entran, y decir
// cuántas hay informa más que cortarlas por la mitad.
function htmlOpciones(m){
  if(!m.multi) return '';
  const et = m.variantes.map(v => v.etiqueta);
  return (et.length <= 4 && et.every(e => e.length <= 12))
    ? et.map(esc).join(' · ')
    : `${et.length} opciones`;
}

/* ---------- Render ---------- */

function tarjeta(p){
  const el = document.createElement('article');
  el.className = 'card' + (p.stock ? '' : ' agotado') + (CON_FOTOS ? '' : ' compacta');
  el.dataset.key = clave(p);
  el.tabIndex = 0;

  // El ID (CEL-APP-005) no se muestra: al cliente no le dice nada. Igual viaja
  // en el mensaje de WhatsApp y se puede buscar por él.
  const sub   = p.color;
  const link  = linkWA(mensajeWA(p));
  const badge = htmlBadge(p);
  const ars   = precioARS(p);
  // En la tarjeta van pocas: las que entran en un renglón sin apretar el diseño
  const chips = specs(p).slice(0,4);
  const opts  = htmlOpciones(p);

  el.innerHTML = `
    ${CON_FOTOS ? `<div class="foto">${badge}${htmlFoto(p,'loading="lazy"')}</div>` : ''}
    <div class="cuerpo">
      <span class="marca">${esc(p.marca)}${CON_FOTOS ? '' : badge}</span>
      <h2 class="nombre">${esc(p.desc)}</h2>
      ${sub ? `<p class="meta">${htmlColores(sub)}<span>${esc(sub)}</span></p>` : ''}
      ${chips.length ? `<div class="specs">${chips.map(s=>`<span>${esc(s)}</span>`).join('')}</div>` : ''}
      ${opts ? `<p class="opciones">${opts}</p>` : ''}
      ${p.incluye ? `<div class="incluye">${esc(p.incluye)}</div>` : ''}
      <div class="pie">
        <div>
          <span class="usd">${precioTarjeta(p)}</span>
          ${ars ? `<div class="ars">${ars}</div>` : ''}
        </div>
        <div class="acciones">
          <button class="mas" type="button" aria-pressed="${enPedidoModelo(p)}"
                  aria-label="Agregar al pedido">
            <span class="ico">${ICONO_MAS}</span>
            <b class="txt-add">Agregar</b><b class="txt-ok">Agregado</b>
          </button>
          ${link ? `<a class="wa" href="${link}" target="_blank" rel="noopener"
                       title="Consultar por WhatsApp" aria-label="Consultar por WhatsApp">${ICONO_WA}</a>` : ''}
        </div>
      </div>
    </div>`;
  return el;
}

/* Se dibuja de a tandas. Con 483 productos, armar las 483 tarjetas en cada
   tecla del buscador hace que escribir se sienta trabado en el celular. En
   pantalla entran doce: dibujamos las primeras y el resto entra al bajar. */
const TANDA = 60;
let LISTA = [], dibujadas = 0;

const finGrilla = document.createElement('div');
finGrilla.className = 'centinela';

const obsTanda = ('IntersectionObserver' in window)
  ? new IntersectionObserver(es => { if(es.some(e => e.isIntersecting)) dibujarTanda(); },
                             { rootMargin: '900px 0px' })
  : null;

function dibujarTanda(){
  if(dibujadas >= LISTA.length) return;
  const lote = LISTA.slice(dibujadas, dibujadas + TANDA);
  dibujadas += lote.length;

  const frag = document.createDocumentFragment();
  const nuevas = lote.map(p => { const el = tarjeta(p); frag.appendChild(el); return el; });
  grid.insertBefore(frag, finGrilla);
  revelar(nuevas);

  if(dibujadas >= LISTA.length){
    obsTanda?.unobserve(finGrilla);
    finGrilla.remove();
    return;
  }
  // Si la tanda entró entera en pantalla, el observador no se vuelve a
  // disparar solo: hay que pedirle la siguiente a mano.
  requestAnimationFrame(() => {
    if(finGrilla.isConnected && finGrilla.getBoundingClientRect().top < innerHeight + 900)
      dibujarTanda();
  });
}

function pintar(){
  pintarMarcas();
  LISTA = filtrar();
  dibujadas = 0;
  // Con CARPETA_FOTOS todos tienen una URL "supuesta", exista o no el archivo,
  // así que contar p.imagen mentiría. En ese modo solo mostramos la cantidad.
  const n = `${LISTA.length} producto${LISTA.length!==1?'s':''}`;
  $('count').textContent = !LISTA.length ? ''
    : CARPETA_FOTOS ? n
    : `${n} · ${LISTA.filter(p => p.imagen).length} con foto`;

  if(!LISTA.length){
    grid.replaceChildren();
    grid.innerHTML = `<div class="msg" style="grid-column:1/-1">
      <h2>No encontramos nada</h2>
      <p>Probá con menos palabras, o buscá por marca (Apple, Canon, Samsung…).</p>
    </div>`;
    return;
  }
  grid.replaceChildren(finGrilla);
  obsTanda?.observe(finGrilla);
  dibujarTanda();
}

/* ---------- Aparición progresiva ---------- */

const quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Una tarjeta se muestra recién cuando está por entrar en pantalla.
const observador = (!quieto && 'IntersectionObserver' in window)
  ? new IntersectionObserver((entradas, obs) => {
      entradas.forEach(e => {
        if(!e.isIntersecting) return;
        e.target.classList.add('vis');
        obs.unobserve(e.target);
      });
    }, { rootMargin: '120px 0px' })
  : null;

function revelar(tarjetas){
  if(!observador){ tarjetas.forEach(el => el.classList.add('vis')); return; }
  tarjetas.forEach((el, i) => {
    // Escalonado solo en las primeras: más allá no se ve y solo suma demora
    if(i < 10) el.style.transitionDelay = (i * 45) + 'ms';
    observador.observe(el);
  });
  // Una imagen que ya estaba en caché puede no disparar onload
  requestAnimationFrame(() => {
    grid.querySelectorAll('.foto img').forEach(im => { if(im.complete) im.classList.add('ok'); });
  });

  // Seguro: las tarjetas arrancan invisibles, así que si el observador fallara
  // el catálogo entero quedaría en blanco. Al segundo, se muestran igual.
  clearTimeout(revelar.red);
  revelar.red = setTimeout(() => {
    if(!grid.querySelector('.card.vis'))
      grid.querySelectorAll('.card').forEach(el => el.classList.add('vis'));
  }, 1000);
}

/* Los filtros se rearman en cada refresco, no solo al abrir la página: si
   agregás una categoría o una marca nueva en la planilla, aparece sola a los
   pocos minutos. Como redibujarlos perdería el scroll de la cinta y el foco,
   solo se rehacen cuando la lista realmente cambió. */
let FIRMA_FILTROS = '';

function armarFiltros(){
  const unicos = campo => [...new Set(PRODUCTOS.map(p => p[campo]).filter(Boolean))]
                            .sort((a,b) => a.localeCompare(b,'es'));
  const cats     = unicos('cat');
  const marcas   = unicos('marca');
  const monturas = unicos('montura');

  // Si lo que estaba elegido ya no existe en la planilla, volvemos a "todo":
  // si no, la grilla quedaría vacía sin explicación.
  if(filtros.cat      && !cats.includes(filtros.cat))          filtros.cat = '';
  if(filtros.marca    && !marcas.includes(filtros.marca))      filtros.marca = '';
  if(filtros.montura  && !monturas.includes(filtros.montura))  filtros.montura = '';

  // Los tramos de precio no dependen de la planilla: se arman una sola vez
  if($('precio').options.length <= 1)
    $('precio').innerHTML = '<option value="">Cualquier precio</option>'
      + RANGOS.map(([val,txt]) => `<option value="${val}">${esc(txt)}</option>`).join('');

  const firma = cats.join('|') + '#' + marcas.join('|') + '#' + monturas.join('|');
  if(firma === FIRMA_FILTROS){ sincronizarControles(); return; }
  FIRMA_FILTROS = firma;

  // Con el número al lado se ve de una si conviene filtrar por ahí
  $('montura').innerHTML = '<option value="">Cualquier montura</option>'
    + monturas.map(m => {
        const n = PRODUCTOS.filter(p => p.montura === m).length;
        return `<option value="${esc(m)}">${esc(m)} (${n})</option>`;
      }).join('');

  $('cats').innerHTML = '';
  // El valor sigue siendo la categoría tal cual (el filtro y el link la usan);
  // lo que se pluraliza es únicamente el texto del chip.
  [['','Todo'], ...cats.map(c => [c, plural(c)])].forEach(([val,txt]) => {
    const b = document.createElement('button');
    b.className='chip'; b.type='button'; b.textContent=txt;
    b.dataset.cat = val;
    b.setAttribute('aria-pressed', String(filtros.cat === val));
    b.onclick = () => {
      filtros.cat = val;
      // Si venías filtrando por Apple y te vas a Consolas, esa marca no existe
      // ahí: sin esto la grilla quedaba vacía y parecía que no hay stock.
      if(filtros.marca && !MODELOS.some(p => (!val || p.cat === val) && p.marca === filtros.marca))
        filtros.marca = '';
      [...$('cats').children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      aplicarFiltro(true);
      // El chip elegido se centra en la fila
      b.scrollIntoView({ behavior: quieto ? 'auto' : 'smooth', block:'nearest', inline:'center' });
    };
    $('cats').appendChild(b);
  });
  sincronizarCinta();   // recién ahora sabemos si la cinta se pasa de ancho
  sincronizarControles();
}

/* ---------- Las marcas de la sección ----------
   Los números dicen cuánto verías si tocaras ese chip: se cuentan con todos
   los demás filtros puestos, pero sin el de marca. Se redibuja solo cuando la
   lista cambió de verdad, para no perder el scroll de la cinta. */
let FIRMA_MARCAS = '';

function marcasDisponibles(){
  const guardado = filtros.marca;
  filtros.marca = '';
  const base = filtrar();
  filtros.marca = guardado;
  const cuenta = new Map();
  base.forEach(p => cuenta.set(p.marca, (cuenta.get(p.marca) || 0) + 1));
  // Primero la marca con más productos: es por la que más se filtra
  return [...cuenta].sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0],'es'));
}

function pintarMarcas(){
  const lista = marcasDisponibles();
  // Con una sola marca no hay nada que elegir y la cinta sobra
  const wrap = $('marcas-wrap');
  wrap.hidden = lista.length < 2;

  const firma = filtros.marca + '#' + lista.map(([m,n]) => m + n).join('|');
  if(firma === FIRMA_MARCAS) return;
  FIRMA_MARCAS = firma;
  if(wrap.hidden){ $('marcas').replaceChildren(); return; }

  const chip = (val, txt, n) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip chip-marca';
    b.dataset.marca = val;
    b.setAttribute('aria-pressed', String(val === filtros.marca));
    b.append(txt);
    const i = document.createElement('i');
    i.textContent = n;
    b.append(i);
    // Tocar la marca que ya estaba puesta la saca: es el atajo para volver
    // a ver la sección entera sin ir hasta el chip "Todas".
    b.onclick = () => {
      filtros.marca = filtros.marca === val ? '' : val;
      aplicarFiltro(true);
    };
    return b;
  };

  const total = lista.reduce((s,[,n]) => s + n, 0);
  $('marcas').replaceChildren(chip('', 'Todas', total), ...lista.map(([m,n]) => chip(m, m, n)));
  sincronizarMarcas();
}

// Deja los controles mostrando lo que dice el objeto `filtros`. Se usa al
// abrir con un link filtrado y al tocar el botón Atrás del navegador.
function sincronizarControles(){
  $('q').value = filtros.q;
  $('clear').hidden = !filtros.q;
  $('orden').value = filtros.orden;
  $('precio').value = filtros.rango;
  $('soloStock').checked = filtros.soloStock;
  sincronizarLentes();
  [...$('cats').children].forEach(b =>
    b.setAttribute('aria-pressed', String((b.dataset.cat || '') === filtros.cat)));
  [...$('marcas').children].forEach(b =>
    b.setAttribute('aria-pressed', String((b.dataset.marca || '') === filtros.marca)));
}

/* Montura y apertura aparecen solo en la categoría Lente. Ofrecerlas en
   "Celular" sería dar un filtro que deja la grilla vacía, y al salir de Lente
   hay que soltarlos: si no, elegís Celular con "Canon RF" puesto y no entiende
   nadie por qué no hay nada. Va aparte de sincronizarControles porque se llama
   mientras escribís en el buscador, y ahí no se puede tocar el <input>. */
function sincronizarLentes(){
  const hayLentes = norm(filtros.cat) === 'lente';
  if(!hayLentes){ filtros.montura = ''; filtros.apertura = ''; }
  $('montura').hidden = $('apertura').hidden = !hayLentes;
  $('montura').value  = filtros.montura;
  $('apertura').value = filtros.apertura;
}

function error(e){
  console.error(e);
  grid.innerHTML = `<div class="msg" style="grid-column:1/-1">
    <h2>No se pudo leer la planilla</h2>
    <p>Casi siempre es porque todavía no está compartida públicamente. Se arregla así:</p>
    <ol>
      <li>Abrí el Sheet en Google Drive.</li>
      <li>Botón <b>Compartir</b> (arriba a la derecha).</li>
      <li>En "Acceso general" elegí <b>Cualquier usuario con el enlace</b>.</li>
      <li>Dejalo como <b>Lector</b> y guardá.</li>
      <li>Recargá esta página.</li>
    </ol>
    <p style="margin-top:18px"><code>${esc(String(e.message||e))}</code></p>
  </div>`;
  $('stamp').textContent = 'Sin conexión';
  const d = document.querySelector('.dot');
  d.style.background = '#5A6273'; d.classList.remove('live');
}

/* El sello del encabezado. Cuando algo falla no lo dejamos diciendo
   "Actualizado": un precio viejo mostrado como si fuera de ahora es peor que
   avisar que no se pudo actualizar. */
let ULTIMA_OK = 0;

function sello(txt, vivo){
  $('stamp').textContent = txt;
  const d = document.querySelector('.stamp .dot');
  if(!d) return;
  d.style.background = vivo ? '' : '#C9A227';
  d.classList.toggle('live', !!vivo);
}
const hhmm = ms => new Date(ms).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});

// Las fechas vienen "24/08/2026". Mostramos la más nueva de toda la planilla,
// no la de la primera fila que tenga algo cargado.
function fechaMasNueva(prods){
  let mejor = null, texto = '';
  for(const p of prods){
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec((p.fecha||'').trim());
    if(!m) continue;
    const d = new Date(+m[3] < 100 ? 2000 + +m[3] : +m[3], +m[2]-1, +m[1]);
    if(isNaN(d)) continue;
    if(!mejor || d > mejor){ mejor = d; texto = p.fecha.trim(); }
  }
  return texto;
}

async function actualizar(primera){
  if(primera) grid.innerHTML = Array.from({length:10},()=>'<div class="skeleton"></div>').join('');
  try{
    // La cotización y el catálogo se piden a la vez, no uno después del otro
    const [prods, tc] = await Promise.all([cargar(), traerCotizacion()]);
    PRODUCTOS = prods;
    MODELOS   = agrupar(prods);   // las variantes del mismo modelo van a una sola tarjeta
    TC = tc;
    ULTIMA_OK = Date.now();
    // Con columna "Imagen" la URL viene escrita, así que existe.
    // Con carpeta hay que comprobar que los archivos estén de verdad.
    CON_FOTOS = CARPETA_FOTOS
      ? await probarFotos(PRODUCTOS)
      : PRODUCTOS.some(p => p.imagen);
    armarFiltros();          // también en los refrescos: la planilla pudo cambiar
    limpiarPedido();         // saca del pedido lo que ya no está en la planilla
    pintar();
    if(primera) abrirFichaDesdeURL();
    const fecha = fechaMasNueva(PRODUCTOS);
    sello(fecha ? `Actualizado ${fecha}` : 'En vivo', true);
  }catch(e){
    console.warn('No se pudo actualizar:', e);
    if(primera) error(e);
    // Ya había datos en pantalla: se quedan, pero avisamos que son de antes
    else sello(`Sin actualizar desde ${hhmm(ULTIMA_OK)}`, false);
  }
}

/* ---------- Links compartibles ----------
   Lo que estás mirando vive en la dirección: podés mandarle a un cliente
   "mirá los iPhone" y le abre ya filtrado. El botón Atrás también funciona. */

const ORDENES = ['modelo','sheet','cat','asc','desc','az'];

function leerURL(){
  const s = new URL(location.href).searchParams;
  filtros.q         = s.get('q') || '';
  filtros.cat       = s.get('cat') || window.CAT_FIJA || '';
  filtros.marca     = s.get('marca') || '';
  filtros.orden     = ORDENES.includes(s.get('orden')) ? s.get('orden') : ORDEN_DEF;
  filtros.soloStock = s.get('stock') === '1';
  // Se validan contra la lista: un link con ?precio=cualquiercosa no debe
  // dejar la grilla vacía sin que se vea ningún filtro puesto
  filtros.rango     = RANGOS.some(r => r[0] === s.get('precio')) ? s.get('precio') : '';
  filtros.apertura  = ['luminoso','cerrado'].includes(s.get('apertura')) ? s.get('apertura') : '';
  // La montura se valida en armarFiltros(), cuando ya sabemos cuáles hay
  filtros.montura   = s.get('montura') || '';
}

function urlActual(){
  const u = new URL(location.href), s = u.searchParams;
  const set = (k,v) => v ? s.set(k,v) : s.delete(k);
  set('q',     filtros.q.trim());
  set('cat',   filtros.cat);
  set('marca', filtros.marca);
  set('orden', filtros.orden === ORDEN_DEF ? '' : filtros.orden);   // el default no ensucia
  set('stock', filtros.soloStock ? '1' : '');
  set('precio',   filtros.rango);
  set('montura',  filtros.montura);
  set('apertura', filtros.apertura);
  const qs = s.toString();
  return u.pathname + (qs ? '?' + qs : '') + (FICHA ? '#p=' + encodeURIComponent(FICHA) : '');
}

// Abriendo el archivo con doble clic (file://) el navegador no deja tocar el
// historial. Con el .bat, que levanta un servidor, anda perfecto.
function escribirURL(push){
  try{ history[push ? 'pushState' : 'replaceState'](null, '', urlActual()); }catch{}
}

const claveDeHash = () => {
  const m = /^#p=(.+)$/.exec(location.hash);
  try{ return m ? decodeURIComponent(m[1]) : ''; }catch{ return ''; }
};

// Si venís scrolleado y cambiás un filtro, los resultados nuevos empiezan
// arriba: sin esto quedarías mirando el medio de una lista que ya no existe.
function volverArriba(){
  if(grid.getBoundingClientRect().top < -4) scrollTo({ top: Math.max(0, grid.offsetTop - 150) });
}
function aplicarFiltro(push){ sincronizarLentes(); escribirURL(push); volverArriba(); pintar(); }

addEventListener('popstate', () => {
  const antes = JSON.stringify(filtros);
  leerURL();
  if(JSON.stringify(filtros) !== antes){ sincronizarControles(); pintar(); }
  const k = claveDeHash();
  if(k && k !== FICHA){ quitarFicha(); abrirFicha(k, null); }
  else if(!k && FICHA) quitarFicha();
});

/* ---------- Ficha del producto ---------- */

let FICHA = null;           // clave de la VARIANTE que se está mirando
let FICHA_MODELO = null;    // el modelo al que pertenece, con todas sus variantes
let COLOR_FICHA = '';       // color elegido en la ficha abierta
let fichaEmpujada = false;  // ¿agregamos una entrada al historial al abrirla?
let cerrarFichaDOM = null;  // saca la ventana de la pantalla, sin tocar el historial

function quitarFicha(){
  FICHA = null; FICHA_MODELO = null; fichaEmpujada = false;
  const c = cerrarFichaDOM; cerrarFichaDOM = null;
  c?.();
}

// Cerrar con la X, Escape o tocando afuera equivale a "atrás": así el botón
// del navegador no te devuelve a la ficha que acabás de cerrar.
function cerrarFicha(){
  if(!FICHA) return;
  if(fichaEmpujada){ fichaEmpujada = false; history.back(); }   // el popstate hace el resto
  else { quitarFicha(); escribirURL(false); }
}

/* Los datos de la ficha: todo lo que cambia cuando el cliente elige otra
   versión. Va aparte de la foto porque al cambiar de variante se redibuja
   entero, y la foto se toca solo si de verdad es otra imagen. */
function htmlDatosFicha(m, v){
  const filas = [
    ['Categoría',   v.cat],
    ['Modelo',      v.modelo],
    ['Color',       v.color ? htmlColorFicha(v) : '', true],
    ['Condición',   v.condicion],
    ['Garantía',    v.garantia],
    // La cotización con la que se calculó el precio en pesos de ESTA ficha.
    // Si no hay pesos (no se pudo traer el dólar), la fila no aparece.
    ['Cotización',  TC ? `$ ${plata(Math.round(TC))} por dólar` : '']
  ].filter(([,x]) => x);

  const lista = specs(v);
  const ars   = precioARS(v);

  return `
    <span class="fi-marca">${esc(v.marca)}</span>
    <h3 class="fi-nombre">${esc(m.desc)}</h3>
    ${lista.length ? `<div class="specs">${lista.map(s=>`<span>${esc(s)}</span>`).join('')}</div>` : ''}
    ${v.incluye ? `<div class="incluye">${esc(v.incluye)}</div>` : ''}
    ${v.detalle ? `<p class="fi-detalle">${esc(v.detalle)}</p>` : ''}
    ${filas.length ? `<dl class="fi-tabla">${filas.map(([t,x,crudo]) =>
      // `crudo` marca las filas que ya vienen armadas como HTML (los
      // puntitos de color). El resto se escapa, como siempre.
      `<dt>${esc(t)}</dt><dd>${crudo ? x : esc(x)}</dd>`).join('')}</dl>` : ''}
    ${htmlOpcionesFicha(m, v)}
    <div class="fi-precio">
      <div class="usd">${precioUSD(v)}</div>
      ${ars ? `<div class="ars">${ars}</div>` : ''}
      <div class="sub" id="fi-sub" hidden></div>
    </div>
    <div class="botones fi-botones">
      ${WHATSAPP ? `<a class="pri cta" href="${linkWA(mensajeWA(v, COLOR_FICHA))}" target="_blank" rel="noopener">${ICONO_WA}Consultar por WhatsApp</a>` : ''}
      <div id="fi-pedido-caja">${htmlPedidoFicha(clave(v))}</div>
    </div>
    <p class="fi-nota">Precio sujeto a cambio sin previo aviso. Consultá disponibilidad antes de comprar.</p>`;
}

/* El selector de versiones. Cada botón lleva SU precio: es lo que el cliente
   está comparando, y verlo junto evita tener que tocar una por una. */
function htmlOpcionesFicha(m, v){
  if(!m.multi) return '';
  const elegida = clave(v);
  const btns = m.variantes.map(x => {
    const k = clave(x);
    return `<button type="button" class="fi-op${x.stock ? '' : ' agotada'}" data-k="${esc(k)}"
             aria-pressed="${k === elegida}"${x.stock ? '' : ' title="Sin stock"'}>
             <b>${esc(x.etiqueta)}</b>
             <i>${x.precio === null ? 'Consultar' : 'USD ' + plata(x.precio)}</i>
           </button>`;
  }).join('');
  return `<div class="fi-ops-caja">
    <span class="fi-ops-lbl">Opciones</span>
    <div class="fi-ops">${btns}</div>
  </div>`;
}

// historia: true = suma al historial · false = reemplaza · null = no lo toca
function abrirFicha(k, historia = true){
  const m = buscarModelo(k);
  if(!m) return;
  // El link puede apuntar a cualquier variante: se abre el modelo con esa puesta
  const v = m.variantes.find(x => clave(x) === k) || m.rep;
  if(FICHA) quitarFicha();

  FICHA_MODELO = m;
  FICHA = clave(v);
  // El color arranca en el que ya haya elegido para este producto en el pedido
  COLOR_FICHA = colorDe(FICHA);
  if(historia !== null){ fichaEmpujada = historia === true; escribirURL(historia === true); }

  const d = document.createElement('div');
  d.id = 'ficha'; d.className = 'modal';
  d.innerHTML = `
    <div class="caja" role="dialog" aria-modal="true" aria-label="${esc(m.desc)}">
      <button class="fi-cerrar" type="button" aria-label="Cerrar">&times;</button>
      <div class="fi-cols">
        <div class="fi-foto">${htmlBadge(v, true)}${htmlFoto(v)}</div>
        <div class="fi-datos">${htmlDatosFicha(m, v)}</div>
      </div>
    </div>`;

  cerrarFichaDOM = montarModal(d, () => { if(FICHA) cerrarFicha(); });
  d.querySelector('.fi-cerrar').onclick = () => cerrarFicha();
  engancharFicha(d, m, v);
  // Si el cliente ya había elegido un color, la ficha abre mostrando ese
  if(COLOR_FICHA) mostrarFotoColor(v, COLOR_FICHA, d);
  // Una foto ya cacheada puede no disparar el onload
  const im = d.querySelector('.fi-foto img');
  if(im?.complete) im.classList.add('ok');
}

// Todo lo que hay que volver a atar cada vez que se redibuja el panel de datos
function engancharFicha(d, m, v){
  engancharPedidoFicha(d, v);
  pintarSubFicha(d, v);
  d.querySelectorAll('.fi-pintas button').forEach(b =>
    b.onclick = () => elegirColorFicha(d, v, b.dataset.color));
  d.querySelectorAll('.fi-op').forEach(b => b.onclick = () => {
    const otra = m.variantes.find(x => clave(x) === b.dataset.k);
    if(otra && clave(otra) !== FICHA) elegirVariante(d, m, otra);
  });
}

/* Cambiar de versión cambia el precio, el ID, el stock y la foto: es otro
   producto de la planilla. Se redibujan los datos y se deja el link apuntando
   a la variante que se está mirando, así lo que se comparte es exactamente
   esto y no la versión más barata. */
function elegirVariante(d, m, v){
  FICHA = clave(v);
  COLOR_FICHA = colorDe(FICHA);
  d.querySelector('.fi-datos').innerHTML = htmlDatosFicha(m, v);
  pintarFotoFicha(d, v);
  engancharFicha(d, m, v);
  escribirURL(false);
  if(COLOR_FICHA) mostrarFotoColor(v, COLOR_FICHA, d);
}

// La foto se toca lo mínimo: si es la misma imagen, solo se actualiza el badge
// de stock. Recargarla siempre haría un parpadeo blanco en cada clic.
function pintarFotoFicha(d, v){
  const cont = d.querySelector('.fi-foto');
  if(!cont) return;
  const img = cont.querySelector('img');
  if(!img || !v.imagen){ cont.innerHTML = htmlBadge(v, true) + htmlFoto(v); return; }
  if(img.getAttribute('src') !== v.imagen){ img.classList.remove('ok'); img.src = v.imagen; }
  const badge = cont.querySelector('.badge');
  if(badge) badge.outerHTML = htmlBadge(v, true);
  else cont.insertAdjacentHTML('afterbegin', htmlBadge(v, true));
}

/* ---------- La parte viva de la ficha ----------
   Unidades, color elegido y subtotal cambian sin cerrar la ficha, así que se
   redibujan solos. Se toca únicamente ese pedazo: volver a armar la ficha
   entera haría parpadear la foto en cada clic del "+". */

// Sin nada cargado, un botón. Con algo cargado, el contador de unidades.
function htmlPedidoFicha(k){
  const n = cantDe(k);
  if(!n) return `<button type="button" class="sec" id="fi-pedido">Agregar al pedido</button>`;
  return `<div class="fi-cant"><span class="lbl">Unidades</span>${htmlStepper(n)}</div>
    <button type="button" class="sec" id="fi-pedido">Quitar del pedido</button>`;
}

function engancharPedidoFicha(d, p){
  const k = clave(p);
  const b = d.querySelector('#fi-pedido');
  // Al agregar se lleva el color que el cliente haya elegido recién
  if(b) b.onclick = () => togglePedido(k, COLOR_FICHA);
  d.querySelectorAll('#fi-pedido-caja .stepper button').forEach(x =>
    x.onclick = () => cambiarCant(k, Number(x.dataset.d)));
}

// El total por varias unidades, al lado del precio: sin esto el número de la
// barra del pedido aparece de la nada.
function pintarSubFicha(d, p){
  const s = d.querySelector('#fi-sub');
  if(!s) return;
  const n = cantDe(clave(p));
  if(n < 2 || p.precio === null){ s.hidden = true; s.textContent = ''; return; }
  const t = p.precio * n;
  s.textContent = `${n} unidades · USD ${plata(t)}` + (TC ? ` · $ ${plata(Math.round(t * TC))}` : '');
  s.hidden = false;
}

function refrescarFicha(){
  const d = document.getElementById('ficha');
  if(!d || !FICHA) return;
  const p = buscarProducto(FICHA);
  if(!p) return;
  const caja = d.querySelector('#fi-pedido-caja');
  if(caja){ caja.innerHTML = htmlPedidoFicha(FICHA); engancharPedidoFicha(d, p); }
  pintarSubFicha(d, p);
}

function elegirColorFicha(d, p, color){
  const k = clave(p);
  COLOR_FICHA = color;
  if(enPedido(k)) elegirColor(k, color);          // ya está en el pedido: se le actualiza el color

  d.querySelectorAll('.fi-pintas button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.color === color)));
  const t = d.querySelector('#fi-color-txt');
  if(t) t.innerHTML = `<b>${esc(color)}</b>`;
  d.querySelector('#fi-color-hint')?.setAttribute('hidden', '');
  // El mensaje de WhatsApp de la ficha ya nombra el color
  const wa = d.querySelector('.fi-botones .cta');
  if(wa) wa.href = linkWA(mensajeWA(p, color));

  mostrarFotoColor(p, color, d);
}

function abrirFichaDesdeURL(){

}

/* ---------- Armar pedido ----------
   Se guarda en este navegador, así que si el cliente cierra la pestaña y
   vuelve, su pedido sigue ahí. */

const PEDIDO_KEY = 'advtecno.pedido';
// Un tope por las dudas: nadie encarga 300 iPhone desde el catálogo, y con un
// número suelto el total del mensaje pierde sentido.
const MAX_CANT = 99;
let PEDIDO = [];
try{
  const g = JSON.parse(localStorage.getItem(PEDIDO_KEY) || '[]');
  if(Array.isArray(g)) PEDIDO = g.map(lineaValida).filter(Boolean);
}catch{}

/* Cada línea del pedido es {k, n, color}: qué producto, cuántas unidades y en
   qué color. Antes el pedido era una lista de claves sueltas, así que el que
   vuelva con ese formato guardado no pierde nada: una clave vieja es una línea
   de una unidad sin color elegido. */
const acotarCant = n => Math.min(MAX_CANT, Math.max(1, Math.round(Number(n)) || 1));

function lineaValida(x){
  if(typeof x === 'string') return x ? {k:x, n:1, color:''} : null;
  if(x && typeof x.k === 'string' && x.k)
    return {k:x.k, n:acotarCant(x.n), color: typeof x.color === 'string' ? x.color : ''};
  return null;
}

const lineaPedido = k => PEDIDO.find(l => l.k === k);
const enPedido = k => !!lineaPedido(k);
const cantDe   = k => lineaPedido(k)?.n || 0;
const colorDe  = k => lineaPedido(k)?.color || '';

// El producto ya resuelto viaja junto a la cantidad: la lista, el total y el
// mensaje de WhatsApp lo necesitan los tres.
const itemsPedido = () => PEDIDO
  .map(l => { const p = buscarProducto(l.k); return p ? {p, n:l.n, color:l.color} : null; })
  .filter(Boolean);

const totalPedido    = () => itemsPedido().reduce((s,it) => s + (it.p.precio || 0) * it.n, 0);
const unidadesPedido = () => itemsPedido().reduce((s,it) => s + it.n, 0);
const hayAConsultar  = () => itemsPedido().some(it => it.p.precio === null);

function guardarPedido(){ try{ localStorage.setItem(PEDIDO_KEY, JSON.stringify(PEDIDO)); }catch{} }

function togglePedido(k, color){
  const i = PEDIDO.findIndex(l => l.k === k);
  if(i === -1) PEDIDO.push({k, n:1, color: color || ''});
  else PEDIDO.splice(i, 1);
  guardarPedido();
  pintarPedido();
  refrescarBotonesPedido();
}

// Bajar de una unidad saca el producto: es lo que el cliente espera del "−" y
// evita dejar líneas en cero que después haya que limpiar.
function cambiarCant(k, delta){
  const l = lineaPedido(k);
  if(!l) return;
  const n = l.n + delta;
  if(n < 1){ togglePedido(k); return; }
  l.n = Math.min(MAX_CANT, n);
  guardarPedido();
  pintarPedido();
  refrescarBotonesPedido();
}

// El color elegido en la ficha se guarda en la línea, así llega al mensaje
function elegirColor(k, color){
  const l = lineaPedido(k);
  if(!l || l.color === color) return;
  l.color = color;
  guardarPedido();
  pintarPedido();
}

// Lo que ya no está en la planilla no puede seguir en el pedido
function limpiarPedido(){
  const antes = PEDIDO.length;
  PEDIDO = PEDIDO.filter(l => buscarProducto(l.k));
  if(PEDIDO.length !== antes) guardarPedido();
  pintarPedido();
}

// Marca el + de cada tarjeta sin redibujar la grilla entera
function refrescarBotonesPedido(){
  grid.querySelectorAll('.card').forEach(c => {
    const m = buscarModelo(c.dataset.key);
    c.querySelector('.mas')?.setAttribute('aria-pressed',
      String(m ? enPedidoModelo(m) : enPedido(c.dataset.key)));
  });
  refrescarFicha();
}

/* El + de la tarjeta carga la versión que la tarjeta muestra. Si el cliente ya
   tenía cargada otra versión de ese mismo modelo, el botón la saca: si no,
   tocar "quitar" no haría nada visible y quedarían dos líneas del mismo
   producto sin que se entienda por qué. */
function togglePedidoModelo(k){
  const m = buscarModelo(k);
  if(!m) return togglePedido(k);
  const cargadas = m.variantes.filter(v => enPedido(clave(v)));
  if(!cargadas.length) return togglePedido(clave(m.rep));
  cargadas.forEach(v => togglePedido(clave(v)));
}

function mensajePedido(){
  const lineas = itemsPedido().map((it,i) => {
    const p = it.p;
    let l = `${i+1}. ${p.desc}${p.id ? ` (${p.id})` : ''}`;
    if(it.color) l += ` · ${it.color}`;
    if(it.n > 1) l += ` · x${it.n}`;
    return l + ' — ' + (p.precio === null ? 'a consultar' : 'USD ' + plata(p.precio * it.n));
  });
  const total = totalPedido();
  let cola = `Total: USD ${plata(total)}`;
  if(TC) cola += ` (aprox. $ ${plata(Math.round(total * TC))})`;
  if(hayAConsultar()) cola += ', más los productos a consultar';
  return `Hola! Te paso mi pedido:\n\n${lineas.join('\n')}\n\n${cola}`;
}

function pintarPedido(){
  const items = itemsPedido();
  document.body.classList.toggle('con-pedido', items.length > 0);
  $('barra-pedido').hidden = !items.length;
  if(!items.length) return;
  const total = totalPedido(), u = unidadesPedido();
  // Cuenta unidades, no líneas: si el cliente cargó tres iPhone iguales, el
  // botón tiene que decir tres.
  $('bp-ver').textContent = `Ver pedido (${u})`;
  $('bp-usd').textContent = 'USD ' + plata(total) + (hayAConsultar() ? ' +' : '');
  $('bp-ars').textContent = TC ? '$ ' + plata(Math.round(total * TC)) : '';
  $('bp-enviar').href = linkWA(mensajePedido());
}

function abrirPedido(){
  if(document.getElementById('pedido')) return;
  const d = document.createElement('div');
  d.id = 'pedido'; d.className = 'modal';

  const dibujar = () => {
    const items = itemsPedido(), total = totalPedido();
    d.innerHTML = `
      <div class="caja" role="dialog" aria-modal="true" aria-label="Tu pedido">
        <h3>Tu pedido</h3>
        ${items.length ? items.map(({p, n, color}) => `
          <div class="pd-item" data-key="${esc(clave(p))}">
            ${p.imagen ? `<img class="pd-foto" src="${esc(p.imagen)}" alt="" onerror="this.remove()">` : ''}
            <div class="pd-txt">
              <b>${esc(p.desc)}</b>
              <i>${esc(p.marca)}</i>
              ${color ? `<span class="pd-color">Color: ${esc(color)}</span>` : ''}
            </div>
            ${htmlStepper(n)}
            <span class="pd-precio">${p.precio === null ? 'Consultar' : 'USD ' + plata(p.precio * n)}
              ${n > 1 && p.precio !== null ? `<i>USD ${plata(p.precio)} c/u</i>` : ''}</span>
            <button class="pd-quitar" type="button" aria-label="Quitar del pedido">&times;</button>
          </div>`).join('')
        : '<p class="pd-vacio">Todavía no agregaste nada. Tocá el + en cualquier producto.</p>'}
        ${items.length ? `
          <div class="pd-total">
            <span>Total</span>
            <div><b>USD ${plata(total)}</b>${TC ? `<i>$ ${plata(Math.round(total*TC))}</i>` : ''}</div>
          </div>` : ''}
        <div class="botones">
          <button type="button" class="sec" id="pd-vaciar"${items.length ? '' : ' disabled'}>Vaciar</button>
          ${WHATSAPP && items.length
            ? `<a class="pri" href="${linkWA(mensajePedido())}" target="_blank" rel="noopener">Enviar por WhatsApp</a>`
            : ''}
        </div>
      </div>`;

    d.querySelectorAll('.pd-quitar').forEach(b => b.onclick = () => {
      togglePedido(b.closest('.pd-item').dataset.key);
      dibujar();
    });
    d.querySelectorAll('.pd-item .stepper button').forEach(b => b.onclick = () => {
      cambiarCant(b.closest('.pd-item').dataset.key, Number(b.dataset.d));
      dibujar();
    });
    const v = d.querySelector('#pd-vaciar');
    if(v) v.onclick = () => {
      PEDIDO = []; guardarPedido(); pintarPedido(); refrescarBotonesPedido(); dibujar();
    };
  };

  dibujar();
  montarModal(d);
}

/* ---------- Easter egg: 7 clics en el triángulo del logo ----------
   Los clics tienen que ser seguidos (menos de 1,2 s entre uno y otro), así
   nadie lo dispara sin querer. Anda igual con el dedo en el celular.        */

const EGG_CLICS = 7, EGG_VENTANA = 1200, EGG_DURACION = 6000;
let eggN = 0, eggUltimo = 0, eggTimer;

/* La voz sale del juego. Los navegadores no dejan sonar audio sin un gesto
   del usuario, pero el egg se dispara tipeando en el buscador, así que el
   gesto ya está hecho. Si aun así lo bloquean se ignora: el egg tiene que
   andar con o sin sonido. */
let vozEgg = null, vozCola = [], vozTimer;

/* Los tres audios no vienen al mismo volumen y no se puede emparejar en el
   archivo: la voz sintetizada ya está al borde de distorsionar y sigue 3 dB
   por debajo de las otras. Se empareja acá, bajando las que sobran. */
const VOZ_VOL = {
  'assets/el-primo-voz.mp3': .63,   // -10.4 LUFS
  'assets/vegetta-voz.mp3':  .75,   // -11.9 LUFS
};

// Acepta una pista o una lista: si son varias, cada una arranca cuando
// termina la anterior (por el evento 'ended', no por tiempos fijos). Hoy los
// dos eggs mandan una sola; quedó así por si alguna vez se les engancha un
// remate atrás.
function sonarVoz(pistas, retraso){
  clearTimeout(vozTimer);
  vozCola = [].concat(pistas);
  const siguiente = () => {
    const src = vozCola.shift();
    if(!src){ vozEgg = null; return; }
    vozEgg = new Audio(src);
    vozEgg.volume = VOZ_VOL[src] || .75;
    vozEgg.addEventListener('ended', siguiente);
    vozEgg.play().catch(() => {});
  };
  vozTimer = setTimeout(siguiente, retraso);
}

function callarVoz(){
  clearTimeout(vozTimer);
  vozCola = [];   // sin esto, cerrar mientras habla el personaje dejaba
  if(vozEgg){ vozEgg.pause(); vozEgg = null; }   // el remate sonando solo
}

// Los dos easter eggs comparten la misma pantalla; solo cambia el contenido
// y una clase que define los colores.
function mostrarEgg(contenido, clase, duracion = EGG_DURACION, fondo = ''){
  if(document.getElementById('egg')) return;
  const d = document.createElement('div');
  d.id = 'egg';
  if(clase) d.className = clase;
  d.innerHTML = `${fondo}<div>${contenido}
      <div class="cerrar">Tocá en cualquier lado para salir</div>
    </div>`;
  document.body.appendChild(d);
  document.body.classList.add('egg-on');
  if(clase) document.body.classList.add(clase + '-on');

  const cerrar = () => {
    callarVoz();
    d.remove();
    document.body.classList.remove('egg-on');
    if(clase) document.body.classList.remove(clase + '-on');
    clearTimeout(eggTimer);
    document.removeEventListener('keydown', porTecla);
  };
  const porTecla = e => { if(e.key === 'Escape') cerrar(); };

  d.addEventListener('click', cerrar);
  document.addEventListener('keydown', porTecla);
  eggTimer = setTimeout(cerrar, duracion);
}

/* ---------- Las cintas de chips se deslizan ----------
   Con overflow-x solo alcanza en el celular. En la compu la barra de scroll
   está oculta a propósito, así que sin esto no había forma de llegar a las
   categorías de la derecha. Ahora anda con la rueda, arrastrando y con flechas.
   Está armado como función porque hay dos cintas: categorías y marcas. */

function activarCinta(idWrap, idCinta, idIzq, idDer){
  const cinta = $(idCinta), wrap = $(idWrap);

  const sincronizar = () => {
    const max = cinta.scrollWidth - cinta.clientWidth;
    wrap.classList.toggle('hay-izq', cinta.scrollLeft > 4);
    wrap.classList.toggle('hay-der', cinta.scrollLeft < max - 4);
  };
  cinta.addEventListener('scroll', sincronizar, {passive:true});
  addEventListener('resize', sincronizar);

  // Flechas: se corre poco menos de una pantalla, para no perder el hilo
  const paso = () => Math.max(180, cinta.clientWidth * 0.75);
  const correr = d => cinta.scrollBy({left:d, behavior: quieto ? 'auto' : 'smooth'});
  $(idIzq).onclick = () => correr(-paso());
  $(idDer).onclick = () => correr(paso());

  // Rueda vertical del mouse → desplazamiento horizontal. Si ya estamos en la
  // punta, dejamos que el gesto siga scrolleando la página como siempre.
  cinta.addEventListener('wheel', e => {
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    const max = cinta.scrollWidth - cinta.clientWidth;
    if(max <= 0) return;
    if((e.deltaY < 0 && cinta.scrollLeft <= 0) || (e.deltaY > 0 && cinta.scrollLeft >= max)) return;
    e.preventDefault();
    cinta.scrollLeft += e.deltaY;
  }, {passive:false});

  // Arrastrar con el mouse, como si agarraras la cinta con la mano
  let x0 = 0, s0 = 0, activo = false, arrastro = false, id = null;

  cinta.addEventListener('pointerdown', e => {
    if(e.pointerType === 'touch' || e.button !== 0) return;   // el dedo ya desliza solo
    activo = true; arrastro = false; id = e.pointerId;
    x0 = e.clientX; s0 = cinta.scrollLeft;
  });
  cinta.addEventListener('pointermove', e => {
    if(!activo || e.pointerId !== id) return;
    const d = e.clientX - x0;
    // Un umbral chico: sin esto, el temblor del clic ya contaría como arrastre
    if(!arrastro){
      if(Math.abs(d) < 5) return;
      arrastro = true;
      cinta.classList.add('arrastrando');
      try{ cinta.setPointerCapture(id); }catch{}
    }
    cinta.scrollLeft = s0 - d;
  });
  const soltar = () => {
    if(!activo) return;
    activo = false;
    cinta.classList.remove('arrastrando');
    try{ if(id !== null && cinta.hasPointerCapture(id)) cinta.releasePointerCapture(id); }catch{}
  };
  cinta.addEventListener('pointerup', soltar);
  cinta.addEventListener('pointercancel', soltar);
  // Si soltaste después de arrastrar, no queremos cambiar de categoría sin
  // querer. La bandera se limpia sola en el próximo pointerdown.
  cinta.addEventListener('click', e => {
    if(!arrastro) return;
    arrastro = false;
    e.stopPropagation(); e.preventDefault();
  }, true);

  return sincronizar;
}

const sincronizarCinta   = activarCinta('cats-wrap',   'cats',   'cats-izq',   'cats-der');

}

$('cfg-btn').addEventListener('click', abrirPanel);

// Abrir y cerrar los filtros en el celular. En la compu el botón no se muestra,
// así que esto no llega a correr nunca.
$('filtros-btn').addEventListener('click', e => {
  const abierta = $('row2').classList.toggle('abierta');
  e.currentTarget.setAttribute('aria-expanded', String(abierta));
});

// Sombra de la barra de filtros cuando queda pegada arriba. Un centinela de
// 1px evita escuchar el scroll, que dispararía cientos de veces por segundo.
if(!quieto && 'IntersectionObserver' in window){
  const centinela = document.createElement('div');
  centinela.style.cssText = 'position:absolute;top:0;height:1px;width:1px';
  document.querySelector('header').appendChild(centinela);
  new IntersectionObserver(
    ([e]) => document.querySelector('.toolbar').classList.toggle('pegada', !e.isIntersecting),
    { rootMargin: '0px' }
  ).observe(centinela);
}

$('marca-btn').addEventListener('click', () => {
  const ahora = Date.now();
  eggN = (ahora - eggUltimo < EGG_VENTANA) ? eggN + 1 : 1;
  eggUltimo = ahora;
  if(eggN >= EGG_CLICS){ eggN = 0; abrirEgg(); }
});

/* ---------- Arranque ---------- */

leerURL();               // por si entraste con un link ya filtrado
sincronizarControles();
pintarPedido();          // el pedido guardado de la visita anterior
actualizar(true);

setInterval(() => actualizar(false), REFRESCO_MIN * 60 * 1000);

// Al volver a la pestaña refrescamos, pero no cada vez: cambiar de app en el
// celular dispara esto todo el tiempo y bajar el catálogo entero de gusto
// gasta datos del cliente.
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && Date.now() - ULTIMA_OK > 60000) actualizar(false);
});
</script>
